<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0B0C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GATELIFT">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>GATELIFT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&display=swap">
<style>
/* Graphite and white. Soft rounded slabs, glassy pills, big numbers with grey decimals.
   One colour of our own: gate violet, for what is next. Green only means done. */
:root{color-scheme:dark;
  --bg:#0B0B0C;--card:#161618;--card2:#1E1E21;--card3:#2A2A2E;--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.13);
  --text:#F5F5F7;--mute:#8E8E93;--dim:#56565B;
  --acc:#FFFFFF;--acc-d:#C9C9CE;--acc-ink:#0B0B0C;--acc-soft:rgba(255,255,255,.08);
  --gate:#6C5CFF;--gate-2:#A99FFF;--gate-soft:rgba(108,92,255,.18);--gate-glow:rgba(108,92,255,.35);--gain:#34C759;
  --warn:#FF5A4D;
  --r:26px;
  --font:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  --disp:Inter,"SF Pro Display",-apple-system,"Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;font-feature-settings:"cv11","ss01"}
body{min-height:100dvh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{max-width:480px;margin:0 auto;min-height:100dvh;position:relative}
.v{padding:calc(env(safe-area-inset-top,0px) + 14px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 104px) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
h1,h2,h3,.disp{font-family:var(--disp);letter-spacing:-.025em;text-wrap:balance}
h1{font-size:30px;font-weight:700;line-height:1.08}
h2{font-size:21px;font-weight:650}
h3{font-size:16px;font-weight:650;letter-spacing:-.01em}
.lbl{font-size:13px;font-weight:500;color:var(--mute)}
.mute{color:var(--mute)}.dim{color:var(--dim)}.acc{color:var(--acc)}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.num em{font-style:normal;color:var(--dim)}
.row{display:flex;align-items:center;gap:10px}.sp{flex:1;min-width:0}
.card{background:var(--card);border-radius:var(--r);padding:18px}
/* glassy dark pill, like the wallet buttons */
.glass{background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.02));box-shadow:inset 0 1px 0 rgba(255,255,255,.12),inset 0 0 0 1px rgba(255,255,255,.06),0 6px 18px rgba(0,0,0,.35)}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;height:56px;border-radius:99px;background:var(--acc);color:var(--acc-ink);font-weight:650;font-size:17px;letter-spacing:-.01em;width:100%}
.btn svg.i{width:18px;height:18px}
.btn .pl{width:22px;height:22px;border-radius:6px;background:var(--acc-ink);color:var(--acc);display:grid;place-items:center}
.btn .pl svg{width:12px;height:12px}
.btn:active{transform:scale(.985)}
.btn.ghost{background:var(--card2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
.btn[disabled]{opacity:.35;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:99px;background:var(--card2);font-size:14px;font-weight:550;color:var(--mute);white-space:nowrap;box-shadow:inset 0 0 0 1px var(--line)}
.chip.on{background:var(--acc);color:var(--acc-ink);box-shadow:none}
.chip svg.i{width:16px;height:16px}
.chips{display:flex;gap:8px;flex-wrap:wrap;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--acc-soft);color:var(--text)}
.tag.g{background:rgba(52,199,89,.14);color:var(--gain)}
.ic{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--card2);color:var(--mute);flex:none}
.ic.on{background:var(--acc);color:var(--acc-ink)}

/* ── the body (flat figure, used for small thumbnails and as the fallback) ── */
.fig{display:block;overflow:visible}
.fig .bs path,.fig .bs ellipse,.fig .bs rect{fill:#2B2C30;stroke:#2B2C30;stroke-width:20;stroke-linejoin:round}
.fig .bs line,.fig .bs [fill="none"]{display:none}
.fig .ms path:not([fill="none"]),.fig .ms ellipse,.fig .ms rect{fill:url(#gMus);stroke:#101012;stroke-width:2.6;stroke-linejoin:round}
.fig .ms .fx ellipse,.fig .ms .fx rect{fill:url(#gJoint)}
.fig .ms .dim path:not([fill="none"]){fill:url(#gDim);stroke:#2a2a2e}
.fig .ms .on path:not([fill="none"]){fill:url(#gLit);stroke:#6d6f74}
.fig .ms .sel path:not([fill="none"]){fill:url(#gLit);stroke:#fff;stroke-width:5}
.fig .ms [fill="none"],.fig .ms line{stroke:#101012;stroke-width:2.4;fill:none}
.fig .gw{filter:url(#fGlow);opacity:.55}
.fig .gw path{fill:#fff}.fig .gw [fill="none"],.fig .gw line{display:none}
.fig.tap .ms g[data-m]{cursor:pointer}
.stage{position:relative;border-radius:28px;overflow:hidden;background:radial-gradient(90% 70% at 50% 30%,#232326 0%,#141416 55%,#0E0E10 100%)}
.stage .floor{position:absolute;left:22%;right:22%;bottom:12px;height:20px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.7),transparent)}
.pair{display:flex;justify-content:center;align-items:flex-end;gap:2px;padding:18px 0 22px;position:relative}
.pair .fig{height:250px;width:auto}
.pair[style*="absolute"] .fig{height:100%}
.b3d{position:absolute;inset:0}
.b3d canvas{display:block;width:100%!important;height:100%!important;touch-action:pan-y}
.b3d{opacity:0;transition:opacity .4s}.b3d.ready{opacity:1}
.b3d.ready~.pair,.b3d.ready~.fig{visibility:hidden}


/* ── floating tab bar ── */
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;gap:2px;padding:6px;background:rgba(30,30,33,.82);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border-radius:99px;z-index:20;box-shadow:inset 0 1px 0 rgba(255,255,255,.1),inset 0 0 0 1px rgba(255,255,255,.06),0 10px 30px rgba(0,0,0,.5)}
.tabs button{height:46px;width:54px;border-radius:99px;display:grid;place-items:center;color:var(--mute)}
.tabs button.on{background:rgba(255,255,255,.16);color:var(--text)}
.tabs button span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ── today ── */
.top{display:flex;align-items:center;gap:12px;padding:2px 0 4px}
.av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(160deg,#3a3a3f,#1b1b1e);font-weight:700;font-size:18px;box-shadow:inset 0 0 0 1px var(--line2)}
.top small{display:block;font-size:13px;color:var(--mute)}
.top b{display:block;font-size:21px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.streak{display:flex;align-items:center;gap:6px;height:44px;padding:0 14px;border-radius:99px;font-weight:650;font-size:15px}
.streak svg{color:var(--gate);width:18px;height:18px}
.hero{background:var(--card);border-radius:30px;padding:18px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.dtitle{display:flex;align-items:flex-start;gap:12px}
.dtitle h1{flex:1;font-size:38px;font-weight:750;letter-spacing:-.04em;line-height:1.02}
.gate{position:relative;width:54px;height:54px;flex:none;display:grid;place-items:center;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.gate svg{position:absolute;inset:0;transform:rotate(-90deg)}
.gate small{display:block;font-size:9px;font-weight:600;color:var(--mute);letter-spacing:.06em;text-transform:uppercase;text-align:center;line-height:1}
/* the day as a path through three gates */
.path{background:var(--card);border-radius:28px;padding:18px 16px 16px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.path::before{content:'';position:absolute;inset:-40% -20% auto auto;width:220px;height:220px;border-radius:50%;background:radial-gradient(closest-side,var(--gate-glow),transparent);pointer-events:none}
.nodes{display:grid;grid-template-columns:repeat(var(--n),1fr);position:relative}
.nodes::before{content:'';position:absolute;top:27px;left:calc(50% / var(--n));right:calc(50% / var(--n));height:2px;background:repeating-linear-gradient(90deg,var(--card3) 0 6px,transparent 6px 11px)}
.nodes .fill{position:absolute;top:27px;left:calc(50% / var(--n));height:2px;background:var(--gate);width:var(--w)}
.node{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;position:relative;z-index:1}
.node .c{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--card2);color:var(--mute);box-shadow:inset 0 0 0 1px var(--line2)}
.node.now .c{background:var(--gate);color:#fff;box-shadow:0 0 0 6px var(--gate-soft),0 8px 24px var(--gate-glow)}
.node.ok .c{background:var(--gain);color:#fff;box-shadow:none}
.node b{font-size:15px;font-weight:600}
.node small{font-size:12.5px;color:var(--mute);margin-top:-6px}
.pathnext{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:18px;background:var(--card2);font-size:14px;color:var(--mute)}
.pathnext b{color:var(--text);font-weight:600}
.mcard .st8{display:inline-flex;align-self:flex-start;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--card3);color:var(--mute)}
.mcard .st8.up{background:var(--gate-soft);color:var(--gate-2)}
.mcard .st8 svg{width:12px;height:12px;stroke-width:2.6}
.seg6{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;margin-top:10px}
.seg6 i{height:4px;border-radius:4px;background:var(--card3)}
.seg6 i.y{background:#fff}
.dlab{display:flex;justify-content:space-between;font-size:11px;color:var(--mute);margin-top:4px;font-variant-numeric:tabular-nums}
.hero .sub{font-size:14px;color:var(--dim);margin-top:-6px}
.meta{display:flex;gap:8px;flex-wrap:wrap}
.meta span{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 14px;border-radius:99px;background:var(--card2);font-size:14px;color:var(--mute);font-weight:500}
.meta svg.i{width:16px;height:16px}
.hero .stage{height:300px;margin:0 -6px}
.musc{display:flex;gap:6px;flex-wrap:wrap}
.musc span{font-size:12px;font-weight:600;padding:5px 11px;border-radius:99px;background:rgba(11,11,12,.7);color:var(--text);box-shadow:inset 0 0 0 1px var(--line2)}
.hero-b{position:absolute;left:14px;right:14px;bottom:14px;z-index:2;pointer-events:none}
.mscroll{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px;scroll-snap-type:x mandatory}
.mscroll::-webkit-scrollbar{display:none}
.mcard{flex:0 0 172px;scroll-snap-align:start;background:var(--card2);border-radius:24px;padding:14px;display:flex;flex-direction:column;gap:4px;text-align:left}
.mcard .fig{height:96px;width:auto;align-self:flex-start;margin:-2px 0 6px -6px}
.mcard b{font-size:19px;font-weight:650;letter-spacing:-.02em}
.exl{display:flex;flex-direction:column;gap:8px}
.exl button{display:flex;align-items:center;gap:10px;min-height:58px;padding:8px 18px;border-radius:99px;box-shadow:inset 0 0 0 1.5px var(--line2);text-align:left;width:100%}
.exl b{font-size:16px;font-weight:550;letter-spacing:-.01em}
.exl .n{color:var(--mute);font-size:15px;white-space:nowrap}
.exl .ph{width:40px;height:40px;border-radius:50%;flex:none;background:#000 center/cover;margin-left:-8px}
.sect{display:flex;align-items:baseline;gap:10px;padding:8px 2px 0}
.sect h2{flex:1}
.sect .lbl{font-size:14px}
.next{display:flex;gap:14px;align-items:center;overflow:hidden}
.next .fig{height:96px;width:auto;margin:-6px -4px -10px}
.steps{display:flex;flex-direction:column;gap:8px}
.st{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card);border-radius:22px;text-align:left;width:100%}
.st b{display:block;font-weight:600;font-size:15px}
.st small{display:block;color:var(--mute);font-size:13px}
.st .ok{width:26px;height:26px;border-radius:50%;border:2px solid var(--card3);display:grid;place-items:center;flex:none}
.st .ok.y{background:var(--gain);border-color:var(--gain);color:#fff}
.st .ok svg{width:15px;height:15px;stroke-width:3}

/* ── body tab ── */
.bodyv .stage{height:min(64vh,580px)}
.bodyv .fig{height:calc(100% - 40px);width:auto;margin:20px auto 0}
.rot{position:absolute;right:14px;bottom:14px;z-index:3;height:44px;padding:0 16px;border-radius:99px;display:flex;align-items:center;gap:8px;font-weight:600}
.side{position:absolute;left:14px;bottom:14px;z-index:3}
.legend{position:absolute;left:16px;top:16px;z-index:3;display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--mute);pointer-events:none}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.mlist{display:flex;flex-direction:column}
.mlist .it{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.mlist .it:first-child{border-top:0}
.bar{height:6px;border-radius:9px;background:var(--card3);overflow:hidden}
.bar i{display:block;height:100%;background:#fff;border-radius:9px}

/* ── run ── */
.runh{position:sticky;top:0;z-index:10;background:rgba(11,11,12,.86);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);padding:calc(env(safe-area-inset-top,0px) + 10px) max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.runh.ov{position:absolute;left:0;right:0;background:linear-gradient(rgba(0,0,0,.55),transparent);backdrop-filter:none;-webkit-backdrop-filter:none}
.prog{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.prog button{display:flex;flex-direction:column;gap:7px;text-align:left;font-size:12px;font-weight:600;color:var(--mute)}
.prog button i{display:block;height:4px;border-radius:4px;background:rgba(255,255,255,.14)}
.prog button.done i{background:var(--gain)}
.prog button.on{color:var(--text)}.prog button.on i{background:#fff}
.clock{font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.sx{display:flex;align-items:center;gap:12px;padding:12px;background:var(--card);border-radius:22px}
.sx.act{box-shadow:inset 0 0 0 1.5px #fff}
.sx.dn{opacity:.5}
.sx .fig{height:64px;width:auto;flex:none;margin:-4px 0}
.sx b{display:block;font-size:15px;font-weight:600}
.sx small{display:block;font-size:13px;color:var(--mute)}
.pbtn{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--card3);flex:none;position:relative}
.pbtn.on{background:#fff;color:var(--acc-ink)}
.pbtn svg.ring{position:absolute;inset:-3px;width:54px;height:54px;transform:rotate(-90deg)}
.pbtn .t{font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.big{display:flex;flex-direction:column;align-items:center;gap:6px;padding:22px 0 8px}
.big .clock{font-size:64px;line-height:1}
.dial{position:relative;width:230px;height:230px;display:grid;place-items:center}
.dial svg{position:absolute;inset:0;transform:rotate(-90deg)}
.field{display:flex;flex-direction:column;gap:6px}
.field input{height:50px;border-radius:99px;background:var(--card2);border:0;box-shadow:inset 0 0 0 1px var(--line);padding:0 18px;outline:none;font-size:16px}
.field input:focus{box-shadow:inset 0 0 0 1.5px #fff}
.ta{width:100%;min-height:240px;border-radius:22px;background:var(--card2);border:0;box-shadow:inset 0 0 0 1px var(--line);padding:14px 16px;outline:none;font-size:16px;line-height:1.45;color:var(--text);resize:vertical}
.ta:focus{box-shadow:inset 0 0 0 1.5px #fff}
.pday .mlist{margin-top:6px}

/* lift: one exercise at a time over its photo */
.lift{margin:0 -16px;position:relative}
.exhero{position:relative;height:min(58vh,460px);background:#0B0B0C center 40%/cover no-repeat}
.exhero::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(11,11,12,.25) 0%,rgba(11,11,12,0) 30%,rgba(11,11,12,.15) 55%,var(--bg) 100%)}
.exhero .nofoto{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(80% 70% at 50% 35%,#232326,#0B0B0C)}
.exhero .nofoto .fig{height:78%;width:auto}
.exttl{position:absolute;left:16px;right:16px;bottom:10px;z-index:2;display:flex;align-items:flex-end;gap:10px}
.exttl h2{font-size:28px;font-weight:700;letter-spacing:-.03em;line-height:1.05}
.exttl small{display:block;font-size:14px;color:var(--mute);margin-top:4px}
.exttl .x{background:rgba(30,30,33,.7);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.liftb{padding:6px 16px 0;display:flex;flex-direction:column;gap:12px}
.sets{display:grid;grid-template-columns:26px 1fr 1fr 50px;gap:8px 8px;align-items:center}
.sets .hd{font-size:12px;font-weight:500;color:var(--dim);text-align:center}
.sets .no{font-weight:600;color:var(--mute);text-align:center;font-variant-numeric:tabular-nums;position:relative}
.sets .no.cur::before{content:"";position:absolute;left:50%;top:50%;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;border-radius:50%;background:var(--gate)}
.sets .no.cur span{visibility:hidden}
.sets .cell{position:relative}
.sets input{width:100%;height:52px;border-radius:99px;background:var(--card2);border:0;text-align:center;font-size:18px;font-weight:600;outline:none;font-variant-numeric:tabular-nums;color:var(--text)}
.sets input:focus{box-shadow:inset 0 0 0 1.5px #fff}
.sets input::placeholder{color:#76767c;font-weight:500}
.sets .u{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:14px;color:var(--mute);pointer-events:none}
.sets .tk{width:50px;height:50px;border-radius:50%;background:var(--card2);display:grid;place-items:center;color:var(--mute)}
.sets .tk.y{background:var(--gain);color:#fff}
.sets .tk svg{stroke-width:2.6}
.sets .okc input{background:#1a1a1d;color:var(--mute)}
.addset{font-size:14px;font-weight:600;color:var(--mute);display:flex;align-items:center;gap:6px;padding:6px 0}
.addset svg{width:16px;height:16px}
.last{font-size:13px;color:var(--mute);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pager{display:flex;align-items:center;gap:12px;padding:12px 0 2px;border-top:1px dashed var(--line2)}
.pager .ring{width:44px;height:44px;position:relative;flex:none;display:grid;place-items:center;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums}
.pager .ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.pager b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pager small{display:block;font-size:13px;color:var(--mute)}
.pnums{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;max-width:52%}
.pnums::-webkit-scrollbar{display:none}
.pnums button{width:36px;height:36px;border-radius:50%;flex:none;font-size:15px;font-weight:550;color:var(--dim);font-variant-numeric:tabular-nums}
.pnums button.dn{color:var(--gain)}
.pnums button.on{background:var(--card3);color:var(--text)}

.foot{position:fixed;left:0;right:0;bottom:0;z-index:15;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(transparent,var(--bg) 35%)}
.foot>div{max-width:448px;margin:0 auto;display:flex;flex-direction:column;gap:8px}

      <button class="tk ${s.ok?'y':''}" data-a="pastTick" data-e="${i}" data-s="${j}" aria-label="Set ${j+1} done">${ic('check')}</button>`).join('')}</div>
     <button class="addset" data-a="pastAdd" data-e="${i}">${ic('plus')}Add set</button></div>`}).join('')}
  </div>
  <div class="foot"><div><button class="btn" data-a="pastSave">Save ${DOW[fromKey(P.d).getDay()]} ${fromKey(P.d).getDate()} ${MON[fromKey(P.d).getMonth()]}</button></div></div>`;
}
function pastSave(){
  const P=V.past,D=DAYS[P.k],t0=fromKey(P.d).setHours(18,0,0,0),M=minsOf(P.k);
  const c={id:Date.now().toString(36),d:P.d,k:P.k,kn:D.n,t0,t1:t0+M.all*60000,step:2,past:true,
    st:Object.fromEntries(warmOf(P.k).map(id=>[id,P.st])),
    ca:{type:D.cType||S.cardioType||CARDIO[S.place==='home'?'home':'gym'][0],goal:P.caMin,sec:P.ca?P.caMin*60:0,run:0,done:P.ca,dist:''},
    ex:P.ex.map(e=>({id:e.id,sets:e.sets.filter(s=>s.ok&&(s.w||s.r)).map(s=>({w:s.w,r:s.r,ok:true}))})).filter(e=>e.sets.length)};
  c.pr=prsOf(c);
  S.log.push(c);S.log.sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:a.t0-b.t0);
  if(!weekMode()&&setsOf(c))S.idx++;
  save();V.past=null;
  const left=missedDays();
  if(left.length){pastNew(left[0].d,left[0].k);toast(`Saved. Next: ${DOW[fromKey(left[0].d).getDay()]}`)}else{V.view='tab';V.tab='log';scrollTo(0,0);toast('Saved to your log')}
}

/* ── paste your own plan ── */
const SAMPLE='DAY 1 (Mon) PUSH\n1. Bench press 4x8-10 60kg rest 2min\n2. Lateral raise 3x12-15 10kg rest 60s\n\nDAY 2 (Tue) PULL\n1. Lat pulldown 4x10-12 55kg rest 90s\n\nSUN: REST (30 min walk, 10 min stretch)';
function impPrev(P){
  const tr=P.days.filter(d=>!d.rest),nEx=tr.reduce((a,d)=>a+d.ex.length,0);
  if(!tr.length)return `<div class="card" style="text-align:center;padding:24px 16px"><h3>Nothing read yet</h3><p class="mute" style="font-size:14px;margin-top:6px">Paste your week above. Each exercise needs sets × reps, like 4x10-12.</p></div>`;
  const u=P.unit||S.unit;
  return `<div class="card"><div class="row"><span class="ic on">${ic('check')}</span><div class="sp"><b>${plural(tr.length,'training day')}${P.days.length>tr.length?` · ${plural(P.days.length-tr.length,'rest day')}`:''} · ${plural(nEx,'exercise')}</b>
     <div class="mute" style="font-size:13px;margin-top:2px">${P.mode==='week'?'Today will follow the weekday in each heading.':'No weekdays found, so the days run in order. Finish one and the next comes up.'}</div></div></div></div>
   ${P.days.map(d=>`<div class="card pday"><div class="row"><span class="tag">${d.dow>=0?DOW[d.dow]:'Day'}</span><h3 class="sp">${esc(d.rest?'Rest day':d.name)}</h3></div>
     ${d.rest?`<div class="mute" style="font-size:14px;margin-top:8px">${esc(d.note||'Rest')}${d.cardio?`<br>Cardio set to ${d.cardio} min ${esc(d.cType)}. Stretches included.`:''}</div>`:
     `<div class="mlist">${d.ex.map(e=>{const g=guessM(e.n).m;return `<div class="it"><span class="sp"><b style="font-size:15px">${esc(e.n)}</b>
       <div class="mute" style="font-size:13px">${e.s} × ${e.lo===e.hi?e.lo:e.lo+'–'+e.hi}${e.hold?'s':''}${e.kg?` · ${e.kg} ${u}`:e.bw?' · bodyweight':''} · ${restTxt(e.rest)}</div>
       <div style="font-size:12px;margin-top:2px;color:${g.length?'var(--acc)':'var(--dim)'}">${g.length?g.slice(0,3).map(x=>GN[x]).join(' · '):'Muscle not recognised. Still logged.'}</div></span></div>`}).join('')}</div>`}</div>`).join('')}
   ${P.bad.length?`<div class="card"><div class="lbl">Lines I skipped</div><div class="mute" style="font-size:13px;margin-top:6px">${P.bad.map(esc).join('<br>')}</div></div>`:''}`;
}
function impView(){const P=parsePlan(V.imp);
  return `<div class="v" style="padding-bottom:120px">
   <div class="row"><button class="x" data-a="impBack" aria-label="Back">${ic('back')}</button><div class="sp"><div class="lbl">Your plan</div><h2 style="font-size:24px;font-weight:800">Paste your week</h2></div></div>
   <p class="mute" style="font-size:14px">One heading per day, one exercise per line, like <b style="color:var(--text)">Bench press 4x8-10 60kg rest 2min</b>. Put the weekday in the heading, like <b style="color:var(--text)">DAY 1 (Mon)</b>, and Today follows your week.</p>
   <textarea class="ta" id="ta" data-in="imp" spellcheck="false" placeholder="${esc(SAMPLE)}">${esc(V.imp)}</textarea>
   <div id="impPrev" class="steps">${impPrev(P)}</div></div>
   <div class="foot"><div><button class="btn" id="impGo" data-a="impGo" ${P.days.some(d=>d.ex.length)?'':'disabled'}>Use this plan</button></div></div>`;
}

/* ── sheets ── */
function sheet(){
  const sh=V.sheet;let inner='';
  if(sh.t==='ex'){const X=EX[sh.id],last=lastFor(sh.id),p=photo(sh.id);
    inner=`${p?`<div class="shot" style="background-image:url('${p}')"></div>`:''}<div class="row"><div class="sp"><div class="lbl">Exercise</div><h2 style="font-size:24px;margin-top:4px">${esc(X.n)}</h2></div><button class="x" data-a="close">${ic('x')}</button></div>
     <div class="stage" style="height:${p?200:280}px"><div class="pair" style="position:absolute;inset:0;padding:14px 0 20px">${fig('front',litMain(X.m))}${fig('back',litMain(X.m))}</div><div class="floor"></div></div>
     <div class="musc">${X.m.map((g,i)=>`<span style="${i?'opacity:.7':''}">${GN[g]}${i?'':' · main'}</span>`).join('')}</div>
     <div class="stats"><div class="stat"><b>${X.s}</b><small>Sets</small></div><div class="stat"><b>${X.r}</b><small>${parseR(X.r).hold?'Hold':'Reps'}</small></div><div class="stat"><b>${X.rest>=60?(X.rest/60)+'m':X.rest+'s'}</b><small>Rest</small></div></div>
     <div><h3 style="margin-bottom:10px">How to</h3><ol class="howto">${X.how.map(t=>`<li>${esc(t)}</li>`).join('')}</ol></div>
     ${last?`<div class="card" style="background:var(--card2)"><div class="lbl">Last time</div><div style="margin-top:6px">${doneSets(last).map(s=>s.w?`${s.w} ${S.unit} × ${s.r}`:s.r).join(' · ')}</div></div>`:''}`;
  }else if(sh.t==='finish'){
    const c=S.cur,left=c.ex.reduce((a,e)=>a+e.sets.filter(s=>!s.ok).length,0);
    inner=`<div class="grab"></div><h2>Finish the session?</h2><p class="mute" style="font-size:14px">${left?`${plural(left,'set')} not ticked. Only ticked sets count as done.`:'Everything is ticked. Nice work.'}</p>
     <button class="btn" data-a="finish">Finish and save</button><button class="btn ghost" data-a="close">Keep going</button>
     <button class="addset" data-a="discard" style="justify-content:center;color:var(--warn)">Discard this session</button>`;
  }
  return `<div class="scrim" data-a="close"><div class="sheet" data-stop>${inner}</div></div>`;
}

/* ══════════════ 3D BODY ══════════════ */
/* One canvas per slot key, kept alive across renders: render() rebuilds the HTML, then the live canvas is moved into the new slot. */
const B3={};
function mount3d(){
  if(!window.Body3D)return;
  document.querySelectorAll('[data-b3d]').forEach(ph=>{
    const key=ph.dataset.b3d;let o={};try{o=JSON.parse(ph.dataset.o||'{}')}catch(e){}
    let h=B3[key];
    if(!h){const host=document.createElement('div');host.className='b3d';h=B3[key]={host,api:null,view:'',sex:S.sex};
      try{h.api=Body3D.mount(host,{sex:S.sex,lit:o.lit||{},autoRotate:!o.tap,interactive:true,selectOnPick:!!o.tap,
        onPick:g=>{if(!o.tap)return;V.sel=g&&GN[g]?g:null;render()}});
        Promise.resolve(h.api.ready).then(()=>host.classList.add('ready'),e=>console.warn('3D body failed to load',e))}catch(e){console.warn('3D body failed',e)}}
    ph.replaceWith(h.host);
    if(h.api){try{if(h.sex!==S.sex&&h.api.setSex){h.sex=S.sex;h.api.setSex(S.sex)}h.api.setLit(o.lit||{});
if(o.tap)h.api.setSelected(V.sel||null);if(o.view&&o.view!==h.view){h.view=o.view;h.api.setView(o.view)}}catch(e){}}
  });
}

/* ══════════════ TIMERS ══════════════ */
let tickH=0;
/* ── timer sounds: Web Audio beeps, unlocked by your first tap (phones block sound until then) ── */
let AC=null;
function audioUnlock(){try{
  if(navigator.audioSession)navigator.audioSession.type='playback'; /* iPhone: play even with the silent switch on */
  if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;AC=new C()}
  if(AC.state==='suspended')AC.resume();
  if(!audioUnlock.done){const b=AC.createBuffer(1,1,22050),s=AC.createBufferSource();s.buffer=b;s.connect(AC.destination);s.start(0);audioUnlock.done=1}
}catch(e){}}
document.addEventListener('pointerdown',audioUnlock,{passive:true});
function tone(f,t0,d,vol,type){const o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.value=f;
  g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+.012);g.gain.setValueAtTime(vol,t0+d-.03);g.gain.linearRampToValueAtTime(0,t0+d);
  o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+d+.03)}
/* kind: 'tick' (last 3 seconds), 'soft' (stretch done), 'alarm' (rest over, cardio target) */
function beep(kind){if(S.sound===false||!AC)return;try{if(AC.state==='suspended')AC.resume();const t=AC.currentTime+.03;
  if(kind==='tick'){tone(988,t,.09,.35,'sine');return}
  if(kind==='soft'){tone(1175,t,.12,.45,'sine');tone(1568,t+.16,.18,.45,'sine');return}
  for(let i=0;i<4;i++){tone(1319,t+i*.42,.13,.6);tone(1760,t+i*.42+.17,.15,.6)}}catch(e){}}
function tick(){
  clearInterval(tickH);
  /* keep timing while a timer runs, even if you step out to another screen */
  if(!S.cur||!(V.view==='run'||V.rest||V.str||S.cur.ca.run))return;
  tickH=setInterval(()=>{
    const c=S.cur;if(!c)return;const now=Date.now();
    const t=document.getElementById('tot');if(t)t.textContent=mmss((now-c.t0)/1000);
    if(V.str){const left=(V.str.end-now)/1000;
      if(left<=0){c.st[V.str.id]=true;const ids=Object.keys(c.st),nx=ids.find(id=>!c.st[id]);V.str=null;buzz(200);beep(nx?'soft':'alarm');save();
        if(nx){startStr(nx)}render();return}
      const e=document.getElementById('stt');if(e)e.textContent=Math.ceil(left);
      const r=document.getElementById('str');if(r)r.setAttribute('stroke-dashoffset',(150.8*(1-left/V.str.tot)).toFixed(1));}
    if(c.ca.run){const sec=caSec(c.ca),e=document.getElementById('cat');if(e)e.textContent=mmss(sec);
      const r=document.getElementById('car'),C=2*Math.PI*104;if(r)r.setAttribute('stroke-dashoffset',(C*(1-Math.min(1,sec/(c.ca.goal*60)))).toFixed(1));
      if(sec>=c.ca.goal*60&&!c.ca.hit){c.ca.hit=1;buzz([200,100,200]);beep('alarm');toast('Cardio target hit')}}
    if(V.rest){const left=(V.rest.end-now)/1000;
      const ls=Math.ceil(left);if(ls<=3&&ls>0&&V.rest.tk!==ls){V.rest.tk=ls;beep('tick')}
      if(left<=0){V.rest=null;buzz([150,80,150]);beep('alarm');toast('Rest over. Next set');render();return}
      const e=document.getElementById('rst');if(e)e.textContent=mmss(left);}
  },250);
}
function startStr(id){const s=STR[id],tot=s.sec*(s.sides||1);V.str={id,end:Date.now()+tot*1000,tot}}
let wake=null;async function keepAwake(){try{if('wakeLock' in navigator&&!wake)wake=await navigator.wakeLock.request('screen');wake&&wake.addEventListener('release',()=>wake=null)}catch(e){}}

/* ══════════════ ACTIONS ══════════════ */
const A={
 tab:v=>{V.tab=v;V.view='tab';V.restore=false;V.resetAsk=false;scrollTo(0,0)},
 obn:()=>{V.ob++},obb:()=>{V.ob=Math.max(0,V.ob-1)},
 obgo:()=>{S.onb=true;V.view='tab';V.tab='today';save()},
 obPlan:()=>{S.onb=true;V.tab='today';save();A.impOpen()},
 impOpen:()=>{V.imp=S.plan?S.plan.src:'';V.view='imp';scrollTo(0,0)},
 impBack:()=>{V.view='tab'},
 impGo:()=>{const P=parsePlan(V.imp);if(!P.days.some(d=>d.ex.length))return;usePlan(P,V.imp);V.view='tab';V.tab='today';scrollTo(0,0);toast('Plan saved')},
 planOff:()=>{S.plan=null;S.idx=0;save();toast('Back on the built-in plan')},
 set:(v,el)=>{const k=el.dataset.k;S[k]=['days','cardio'].includes(k)?+v:v;if(k==='days'||k==='place')S.idx=S.idx%split().d.length;save()},
 start:v=>{S.cur=newSession();S.cur.step=+v||0;V.view='run';save();keepAwake();scrollTo(0,0)},
 resume:()=>{V.view='run';keepAwake();scrollTo(0,0)},
 goStep:v=>{if(!S.cur){A.start(v);return}S.cur.step=+v;V.view='run';save();scrollTo(0,0)},
 leave:()=>{V.view='tab';V.tab='today';V.str=null},
 stPlay:v=>{if(V.str&&V.str.id===v){V.str=null}else startStr(v)},
 stTog:v=>{S.cur.st[v]=!S.cur.st[v];save()},
 caType:v=>{S.cur.ca.type=v;S.cardioType=v;save()},
 caGoal:v=>{S.cur.ca.goal=+v;S.cur.ca.hit=0;save()},
 caRun:()=>{const ca=S.cur.ca;if(ca.run){ca.sec=caSec(ca);ca.run=0}else ca.run=Date.now();save()},
 caDone:()=>{const ca=S.cur.ca;if(ca.run){ca.sec=caSec(ca);ca.run=0}ca.done=true;if(!S.cur.ex.length){V.sheet={t:'finish'};save();return}S.cur.step=2;save();scrollTo(0,0)},
 tick:(v,el)=>{const e=S.cur.ex[+el.dataset.e],s=e.sets[+el.dataset.s],X=xs(S.cur.k,e.id),R=parseR(X.r),last=lastFor(e.id,S.cur.k),ls=last&&doneSets(last)[+el.dataset.s];
   if(!s.ok){if(!s.r)s.r=String(ls?ls.r:R.hi);if(!s.w)s.w=ls&&ls.w?String(ls.w):X.kg?String(X.kg):'';s.ok=true;V.rest=X.rest>0?{end:Date.now()+X.rest*1000}:null;buzz(30)}else{s.ok=false}save()},
 addSet:(v,el)=>{const e=S.cur.ex[+el.dataset.e],p=e.sets[e.sets.length-1];e.sets.push({w:p?p.w:'',r:'',ok:false});save()},
 pastOpen:v=>{const [d,k]=String(v||'').split('|');pastNew(d||'',k||'')},
 pastBack:()=>{V.past=null;V.view='tab'},
 pastDay:v=>{const P=V.past;P.d=v;if(weekMode()){const w=keyForDate(fromKey(v));if(DAYS[w]&&!DAYS[w].rest&&w!==P.k){P.k=w;P.ex=pastEx(w)}}},
 pastK:v=>{const P=V.past;P.k=v;P.ex=pastEx(v)},
 pastSt:()=>{V.past.st=!V.past.st},pastCa:()=>{V.past.ca=!V.past.ca},
 pastTick:(v,el)=>{const s=V.past.ex[+el.dataset.e].sets[+el.dataset.s];s.ok=!s.ok},
 pastAdd:(v,el)=>{const e=V.past.ex[+el.dataset.e],p=e.sets[e.sets.length-1];e.sets.push({w:p?p.w:'',r:p?p.r:'',ok:true})},
 pastSave:()=>pastSave(),
 exGo:v=>{S.cur.exi=+v;save();scrollTo(0,0)},
 pickBody:v=>{V.tab='body';V.view='tab';V.sel=v;V.side=BACKG.includes(v)&&!FRONTG.includes(v)?'back':'front';scrollTo(0,0)},
 restAdd:v=>{if(V.rest)V.rest.end+=(+v)*1000},restSkip:()=>{V.rest=null},
 exInfo:v=>{V.sheet={t:'ex',id:v}},close:()=>{V.sheet=null},
 finishAsk:()=>{V.sheet={t:'finish'}},finish:()=>{V.sheet=null;finish()},
 discard:()=>{S.cur=null;V.sheet=null;V.rest=null;V.str=null;V.view='tab';V.tab='today';save()},
 home:()=>{V.view='tab';V.tab='today';scrollTo(0,0)},
 rotate:()=>{V.side=V.side==='front'?'back':'front';if(V.sel&&!(V.side==='front'?FRONTG:BACKG).includes(V.sel))V.sel=null},
 pick:v=>{V.sel=v||null},
 openDay:v=>{V.logId=v;V.view='day';V.delAsk=null;scrollTo(0,0)},closeDay:()=>{V.view='tab';V.tab='log'},
 delAsk:v=>{V.delAsk=v},delNo:()=>{V.delAsk=null},del:v=>{S.log=S.log.filter(s=>s.id!==v);save();V.view='tab';V.tab='log'},
 copy:()=>{const t=JSON.stringify(S);(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Backup copied'),()=>{V.restore=true;render();const i=document.getElementById('rs');if(i){i.value=t;i.select()}toast('Select and copy the text')})},
 restoreOpen:()=>{V.restore=!V.restore},
 restore:()=>{try{const o=JSON.parse(document.getElementById('rs').value);if(o.v!==2)throw 0;S=Object.assign(fresh(),o);regLib();save();V.restore=false;toast('Restored')}catch(e){toast('That text is not a backup')}},
 resetAsk:()=>{V.resetAsk=true},resetNo:()=>{V.resetAsk=false},
 sound:v=>{S.sound=v==='1';save();if(S.sound){audioUnlock();beep('alarm')}},
 soundTest:()=>{audioUnlock();setTimeout(()=>beep('alarm'),60)},
 reset:()=>{
S=fresh();save();V={...V,view:'ob',ob:0,tab:'today',resetAsk:false}},
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');
  /* tap on the body figure */
  if(!el||el.classList.contains('stage')){const g=e.target.closest('.fig.tap g[data-m]');if(g&&ID2G[g.dataset.m]){V.sel=ID2G[g.dataset.m];render();return}}
  if(!el)return;
  if(el.classList.contains('scrim')&&e.target.closest('[data-stop]'))return;
  const f=A[el.dataset.a];if(!f)return;f(el.dataset.v,el);if(!toast.h||el.dataset.a!=='copy')render();
});
document.addEventListener('input',e=>{
  const el=e.target,k=el.dataset.in;if(!k)return;
  if(k==='imp'){V.imp=el.value;clearTimeout(A.impT);A.impT=setTimeout(()=>{const P=parsePlan(V.imp),pv=document.getElementById('impPrev'),b=document.getElementById('impGo');
    if(pv)pv.innerHTML=impPrev(P);if(b)b.disabled=!P.days.some(d=>d.ex.length)},250);return}
  if(k==='pw'||k==='pr'){if(V.past)V.past.ex[+el.dataset.e].sets[+el.dataset.s][k==='pw'?'w':'r']=el.value.replace(/[^\d.]/g,'');return}
  if(k==='name')S.name=el.value.trim();

  else if(k==='dist')S.cur.ca.dist=el.value;
  else if(k==='w'||k==='r'){S.cur.ex[+el.dataset.e].sets[+el.dataset.s][k]=el.value.replace(/[^\d.]/g,'')}
  save();
});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){audioUnlock();if(V.view==='run'){keepAwake()}if(S.cur)render()}});
render();
cloudInit();
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});
