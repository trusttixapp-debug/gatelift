<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F3F6FC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="GATELIFT">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>GATELIFT</title>
<style>
/* Layout: one phone column. Everyday screens are cool white with navy type; the big moments flip to full System blue. */
:root{color-scheme:light;
  --bg:#F3F6FC;--card:#FFFFFF;--card2:#E9EFFA;--card3:#D9E3F5;--line:#D3DDEF;--edge:#E2E9F6;
  --text:#0A1633;--mute:#4A5878;--dim:#8A96B0;
  --acc:#1A4BFF;--acc-d:#0A2FD6;--inv:#FFFFFF;
  --navy:#071233;--navy2:#0D1E52;--sys:#3D7BFF;--sys-l:#8FB4FF;--warn:#E5483B;--ok:#16A36A;
  --fig-line:rgba(10,22,51,.42);--fig-fill:rgba(10,22,51,.035);--fig-lit:var(--acc);--fig-lit-line:rgba(255,255,255,.6);
  --r:24px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,"Segoe UI",Roboto,system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.4;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
body{min-height:100dvh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:var(--text);background:var(--card2);border:1px solid transparent;
  border-radius:16px;padding:14px 16px;width:100%;font-size:16px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--acc)}
textarea{resize:vertical;min-height:84px;line-height:1.45}
::placeholder{color:var(--dim)}
.num{font-variant-numeric:tabular-nums}
#app{max-width:520px;margin:0 auto;position:relative}

/* ── views ── */
.v{padding:calc(env(safe-area-inset-top) + 16px) 18px calc(env(safe-area-inset-bottom) + 96px);min-height:100dvh}
.v.flush{padding-bottom:calc(env(safe-area-inset-bottom) + 28px)}
.enter>*{animation:rise .42s cubic-bezier(.2,.8,.2,1) both}
.enter>*:nth-child(2){animation-delay:.04s}.enter>*:nth-child(3){animation-delay:.08s}
.enter>*:nth-child(4){animation-delay:.12s}.enter>*:nth-child(5){animation-delay:.16s}
.enter>*:nth-child(6){animation-delay:.2s}.enter>*:nth-child(n+7){animation-delay:.24s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.h1{font-size:32px;font-weight:800;letter-spacing:-.025em;line-height:1.08}
.h2{font-size:22px;font-weight:750;letter-spacing:-.02em}
.h3{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:26px 4px 10px}
.sub{color:var(--mute);font-size:15px}
.dim{color:var(--dim)}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.stack>*+*{margin-top:12px}
.gap8>*+*{margin-top:8px}

.card{background:var(--card);border-radius:var(--r);padding:18px;border:1px solid var(--edge)}
.card.tap{transition:transform .15s}
.card.tap:active{transform:scale(.98)}
.pill{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:999px;
  background:var(--card2);color:var(--mute);font-size:13px;font-weight:600}
.pill.acc{background:var(--acc);color:var(--inv)}
.pill.sys{background:rgba(124,192,255,.12);color:var(--sys)}

.btn{height:58px;border-radius:999px;font-weight:700;font-size:17px;display:flex;align-items:center;
  justify-content:center;gap:10px;width:100%;transition:transform .12s,filter .12s;position:relative;overflow:hidden}
.btn:active{transform:scale(.97)}
.btn.acc{background:var(--acc);color:var(--inv)}
.btn.dark{background:var(--card2);color:var(--text)}
.btn.inv{background:var(--inv);color:var(--acc)}
.btn.ghost{background:transparent;color:var(--mute);height:46px;font-weight:600;font-size:15px}
.btn.sm{height:44px;font-size:15px;width:auto;padding:0 18px}
.btn.acc::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);
  transform:translateX(-120%);animation:sweep 1.1s .35s ease-out 1}
@keyframes sweep{to{transform:translateX(120%)}}
.ib{width:46px;height:46px;border-radius:50%;background:var(--card2);display:grid;place-items:center;flex-shrink:0}
.ib.txt{width:auto;padding:0 16px;border-radius:999px;font-weight:650;font-size:15px}
.ic{width:22px;height:22px;flex-shrink:0}
.ic.s{width:18px;height:18px}

/* ── tab bar ── */
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(520px,100%);z-index:30;
  display:grid;grid-template-columns:repeat(4,1fr);padding:6px 8px calc(env(safe-area-inset-bottom) + 6px);
  background:rgba(255,255,255,.94);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line)}
.tabs button{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 4px;
  color:var(--dim);font-size:11px;font-weight:650;letter-spacing:.02em;transition:color .2s}
.tabs button .ic{width:21px;height:21px}
.tabs button.on{color:var(--acc)}
.tabs button.on::before{content:'';position:absolute;top:-6px;left:50%;width:22px;height:3px;margin-left:-11px;border-radius:0 0 3px 3px;background:var(--acc)}

/* ── system window: the glow lives on the frame, never the content ── */
.sys{position:relative;border-radius:18px;padding:16px 18px;background:linear-gradient(180deg,var(--navy2),var(--navy));color:#fff;
  border:1px solid rgba(91,149,255,.6);box-shadow:0 0 0 1px rgba(26,75,255,.15),0 10px 30px rgba(26,75,255,.28),inset 0 0 22px rgba(61,123,255,.18)}
.sys::before,.sys::after{content:"";position:absolute;width:14px;height:14px;border:2px solid var(--sys)}
.sys::before{top:-2px;left:-2px;border-right:0;border-bottom:0;border-radius:6px 0 0 0}
.sys::after{bottom:-2px;right:-2px;border-left:0;border-top:0;border-radius:0 0 6px 0}
.sys .t{font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--sys-l);text-transform:uppercase;margin-bottom:6px}
.sys p{font-size:15px;color:#fff}
.sys .sub{color:rgba(255,255,255,.7)}
.sysline{font-family:var(--mono);font-size:13px;color:var(--acc);letter-spacing:.01em}

/* ── hunter card ── */
.hunter{display:flex;gap:16px;align-items:center}
.badge{flex-shrink:0;filter:drop-shadow(0 6px 12px rgba(10,22,51,.22))}
.xpbar{height:8px;border-radius:99px;background:var(--card3);overflow:hidden;margin-top:10px}
.xpbar i{display:block;height:100%;border-radius:99px;background:var(--acc);width:0;transition:width 1s cubic-bezier(.2,.8,.2,1)}

/* ── week strip ── */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.week small{font-size:12px;color:var(--dim);font-weight:600;display:block;margin-bottom:6px}
.week .d{width:40px;height:40px;margin:0 auto;border-radius:50%;background:var(--card2);display:grid;place-items:center;
  font-size:14px;font-weight:650;color:var(--mute)}
.week .d.today{box-shadow:0 0 0 2px var(--text) inset;color:var(--text)}
.week .d.hit{background:var(--acc);color:var(--inv)}
.week .d.hit .ic{width:18px;height:18px;stroke-width:3}

/* ── stats ── */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border-radius:20px;padding:16px;border:1px solid var(--edge)}
.stat small{color:var(--mute);font-size:13px;font-weight:600}
.stat b{display:block;font-size:28px;font-weight:800;letter-spacing:-.02em;margin-top:4px}
.stat b em{font-style:normal;font-size:15px;font-weight:600;color:var(--mute);margin-left:3px}

/* ── quest card ── */
.quest{background:radial-gradient(120% 90% at 85% 10%,#3D6BFF 0%,transparent 55%),linear-gradient(160deg,var(--acc),var(--acc-d));color:#fff;border-radius:28px;padding:18px;position:relative;overflow:hidden;
  box-shadow:0 18px 40px rgba(26,75,255,.28);--fig-line:rgba(255,255,255,.6);--fig-fill:rgba(255,255,255,.06);--fig-lit:#fff;--fig-lit-line:rgba(26,75,255,.55)}
.quest .sub,.quest li{color:rgba(255,255,255,.78)!important}
.quest .pill{background:rgba(255,255,255,.16);color:#fff}
.quest .pill.acc{background:#fff;color:var(--acc)}
.quest .btn.acc{background:#fff;color:var(--acc)}
.quest .btn.dark{background:rgba(255,255,255,.16);color:#fff}
.quest .btn.ghost{color:rgba(255,255,255,.85)}
.quest .holo{position:absolute;right:4px;top:10px;height:190px;opacity:.9;pointer-events:none;
  -webkit-mask:linear-gradient(90deg,transparent,#000 35%);mask:linear-gradient(90deg,transparent,#000 35%)}
.quest .holo svg{height:100%;width:auto}
.quest .body{position:relative;max-width:68%}
.quest ul{list-style:none;margin-top:12px}
.quest li{font-size:14px;color:var(--mute);padding:3px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.quest li b{color:#fff;font-weight:600}

.list .it{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--card);border-radius:20px;border:1px solid var(--edge)}
.list .it+.it{margin-top:8px}
.list .it .ico{width:44px;height:44px;border-radius:14px;background:var(--card2);display:grid;place-items:center;color:var(--acc);flex-shrink:0}
.list .it b{display:block;font-weight:650}
.list .it small{color:var(--mute);font-size:13px}

/* ── full-bleed screens ── */
.full{min-height:100dvh;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 20px) 22px calc(env(safe-area-inset-bottom) + 24px)}
.full.acc{color:#fff;background:
  repeating-linear-gradient(0deg,rgba(255,255,255,.055) 0 1px,transparent 1px 32px),
  repeating-linear-gradient(90deg,rgba(255,255,255,.055) 0 1px,transparent 1px 32px),
  radial-gradient(80% 50% at 80% 0%,#4C7BFF,transparent 70%),linear-gradient(170deg,var(--acc),var(--acc-d) 70%,#0723A8)}
.full.acc .sub{color:rgba(255,255,255,.78)}
.full .mid{flex:1;display:flex;flex-direction:column;justify-content:center}
.mega{font-size:52px;font-weight:850;letter-spacing:-.035em;line-height:1}
.tag{font-family:var(--mono);font-size:12px;letter-spacing:.2em;text-transform:uppercase}

/* ── session ── */
.shd{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.shd .c{flex:1;text-align:center}
.shd .c small{display:block;font-size:12px;color:var(--mute);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shd .c b{font-family:var(--mono);font-size:17px;font-weight:600}
.hero{position:relative;height:250px;margin:6px 0 0;overflow:hidden;border-radius:28px;
  background:radial-gradient(60% 70% at 50% 40%,rgba(61,123,255,.45),transparent 72%),linear-gradient(180deg,var(--navy2),var(--navy));
  box-shadow:inset 0 0 0 1px rgba(91,149,255,.45),0 14px 34px rgba(7,18,51,.22);
  --fig-line:rgba(190,212,255,.6);--fig-fill:rgba(255,255,255,.04);--fig-lit:#fff;--fig-lit-line:rgba(26,75,255,.6)}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(143,180,255,.06) 0 1px,transparent 1px 4px);
  -webkit-mask:linear-gradient(transparent,#000 20%,#000 70%,transparent)}
.hero .bodies{position:absolute;inset:0;display:flex;justify-content:center;align-items:center;gap:6px}
.hero .bodies svg{height:232px;width:auto}
.hero .bodies .bk{opacity:.55;transform:scale(.86)}
.hero .scan{position:absolute;left:0;right:0;height:60px;top:-60px;
  background:linear-gradient(180deg,transparent,rgba(143,180,255,.22),transparent);animation:scan 3.6s linear infinite}
@keyframes scan{to{top:260px}}
.hero .fade{display:none}
.exname{margin-top:18px;position:relative}
.exname .mg{color:var(--acc);font-size:14px;font-weight:650;margin-top:4px}
.tgt{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

.tip{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:18px;background:var(--card);border:1px solid var(--edge);margin-top:14px;font-size:14.5px}
.tip .ic{color:var(--acc);margin-top:1px}
.tip.warn{background:rgba(229,72,59,.08);border-color:rgba(229,72,59,.2)}.tip.warn .ic{color:var(--warn)}
.note{margin-top:10px;padding:14px 16px;border-radius:18px;border:1px dashed var(--line);color:var(--mute);font-size:14.5px}
.last{margin-top:12px;color:var(--dim);font-size:13.5px;padding:0 4px}
.last b{color:var(--mute);font-weight:600}

.sets{margin-top:18px}
.set{display:grid;grid-template-columns:30px 1fr 1fr 56px;gap:8px;align-items:center;margin-top:10px;transition:opacity .2s}
.set .sn{text-align:center;color:var(--dim);font-weight:650;font-size:15px}
.set.cur .sn::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--acc)}
.set.cur .sn span{display:none}
.fld{position:relative;display:block}
.fld input{height:56px;border-radius:999px;text-align:center;font-weight:650;font-size:18px;padding:0 34px 0 14px;background:var(--card2)}
.fld em{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-style:normal;font-size:12px;color:var(--dim);font-weight:600;pointer-events:none}
.chk{width:56px;height:56px;border-radius:50%;background:var(--card2);display:grid;place-items:center;color:var(--mute);transition:background .2s,color .2s,transform .15s}
.chk .ic{width:24px;height:24px;stroke-width:2.6}
.chk:active{transform:scale(.9)}
.set.done .chk{background:var(--acc);color:var(--inv);animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
.set.done .fld input{background:var(--card);color:var(--mute)}
.set.drop .sn{color:var(--acc);font-size:13px}
@keyframes pop{0%{transform:scale(.7)}100%{transform:scale(1)}}
.addset{margin-top:12px;width:100%;height:48px;border-radius:999px;border:1px dashed var(--line);color:var(--mute);font-weight:600;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:38px;padding:0 15px;border-radius:999px;background:var(--card2);color:var(--mute);font-weight:600;font-size:14px;transition:all .15s}
.chip.on{background:var(--text);color:var(--inv)}
.chip.pain.on{background:var(--warn);color:#fff}
.xpfloat{position:fixed;z-index:60;font-family:var(--mono);font-weight:700;color:var(--acc);font-size:15px;pointer-events:none;animation:xpf 1s ease-out forwards}
@keyframes xpf{to{transform:translateY(-46px);opacity:0}}

.sbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(520px,100%);z-index:30;
  padding:12px 18px calc(env(safe-area-inset-bottom) + 14px);background:linear-gradient(transparent,var(--bg) 26%)}
.sbar .meta{display:flex;align-items:center;gap:12px;padding:10px 0 14px;border-top:1px dashed var(--line)}
.sbar .meta b{display:block;font-weight:650;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbar .meta small{color:var(--mute);font-size:13px}
.pager{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;max-width:52%}
.pager::-webkit-scrollbar{display:none}
.pager button{min-width:36px;height:36px;border-radius:50%;color:var(--dim);font-weight:650;font-size:15px}
.pager button.ok{color:var(--acc)}
.pager button.on{background:var(--card3);color:var(--text)}
.mini-ring{flex-shrink:0;position:relative;width:46px;height:46px}
.sbar .mini-ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;font-weight:700;overflow:visible}
.sbar .two{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}

/* rest sheet */
.rest{position:fixed;inset:0;z-index:50;background:rgba(7,18,51,.5);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  display:flex;align-items:flex-end;justify-content:center;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.rest .in{width:min(520px,100%);background:var(--card);border-radius:32px 32px 0 0;padding:26px 22px calc(env(safe-area-inset-bottom) + 22px);
  text-align:center;animation:up .35s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(60%)}}
.ring{position:relative;width:220px;height:220px;margin:14px auto 10px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10}
.ring .trk{stroke:var(--card3)}
.ring .prg{stroke:var(--acc);stroke-linecap:round;transition:stroke .3s}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:56px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.ring.hot .prg{stroke:var(--warn)}.ring.hot b{color:var(--warn)}
.rest .two{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;margin-top:18px}

/* done */
.cong{background:radial-gradient(90% 70% at 80% 0%,#4C7BFF,transparent 65%),linear-gradient(165deg,var(--acc),var(--acc-d));color:#fff;box-shadow:0 18px 40px rgba(26,75,255,.3);border-radius:34px;padding:30px 22px 26px;text-align:center;animation:popin .6s cubic-bezier(.3,1.4,.5,1) both}
@keyframes popin{from{transform:scale(.85);opacity:0}}
.okc{width:92px;height:92px;border-radius:50%;margin:0 auto 18px;display:grid;place-items:center;background:rgba(255,255,255,.16)}
.okc span{width:64px;height:64px;border-radius:50%;background:var(--inv);color:var(--acc);display:grid;place-items:center}
.okc .ic{width:32px;height:32px;stroke-width:3}
.cong h1{font-size:30px;font-weight:850;letter-spacing:-.025em}
.cong p{margin-top:6px;color:rgba(255,255,255,.82);font-size:15px}
.cong .tag{display:block;margin-bottom:10px;color:rgba(255,255,255,.7)}
.levelup{text-align:center;padding:22px 18px}
.levelup .badge{margin:4px auto 10px;display:block;animation:spinin .9s cubic-bezier(.2,1.3,.4,1) both}
@keyframes spinin{from{transform:rotate(-200deg) scale(.4);opacity:0}}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.cal small{font-size:12px;color:var(--dim);font-weight:600;padding-bottom:4px}
.cal .c{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:600;color:var(--mute)}
.cal .c.hit{background:var(--acc);color:var(--inv)}
.cal .c.today{box-shadow:0 0 0 2px var(--text) inset;color:var(--text)}

/* forms */
label.f{display:block}
label.f>span{display:block;font-size:13px;font-weight:650;color:var(--mute);margin:0 4px 8px}
.exed{background:var(--card);border-radius:22px;padding:14px;border:1px solid var(--edge)}
.exed+.exed{margin-top:10px}
.exed .g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.exed .g4 label span{font-size:11px;color:var(--dim);font-weight:650;display:block;margin:0 0 5px 6px}
.exed .g4 input,.exed .g4 select{padding:12px 10px;text-align:center;border-radius:14px}
.exed .g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.exed .g2 label span{font-size:11px;color:var(--dim);font-weight:650;display:block;margin:0 0 5px 6px}
.exed .g2 input,.exed .g2 select{padding:12px 10px;border-radius:14px}
.exed .acts{display:flex;gap:6px;justify-content:flex-end;margin-top:10px}
.exed .acts button{width:38px;height:38px;border-radius:12px;background:var(--card2);display:grid;place-items:center;color:var(--mute)}
.exed .acts .ic{width:18px;height:18px}
.who{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.who button{background:var(--card);border-radius:20px;padding:10px 4px 10px;border:2px solid var(--edge);transition:border-color .2s}
.who button.on{border-color:var(--acc);background:var(--card2)}
.who .wf{height:104px;display:flex;align-items:flex-end;justify-content:center}
.who .wf svg{height:100%;width:auto}
.who button:nth-child(n+3) .wf svg{height:80%}
.who b{display:block;font-size:13px;font-weight:700;margin-top:6px}
.who button.on b{color:var(--acc)}
.seg{display:flex;background:var(--card2);border-radius:999px;padding:4px}
.seg button{flex:1;height:44px;border-radius:999px;font-weight:650;color:var(--mute)}
.seg button.on{background:var(--acc);color:var(--inv)}
.opt{display:flex;gap:14px;align-items:center;padding:18px;border-radius:22px;background:var(--card);border:1px solid var(--edge);text-align:left;width:100%}
.opt+.opt{margin-top:10px}
.opt .ico{width:50px;height:50px;border-radius:16px;background:var(--card2);color:var(--acc);display:grid;place-items:center;flex-shrink:0}
.opt b{display:block;font-size:17px;font-weight:700}
.opt small{color:var(--mute);font-size:14px}
.tl{list-style:none;position:relative;margin-top:6px}
.tl li{position:relative;padding:12px 0 12px 30px}
.tl li::before{content:"";position:absolute;left:7px;top:20px;width:10px;height:10px;border-radius:50%;background:var(--acc)}
.tl li::after{content:"";position:absolute;left:11px;top:34px;bottom:-14px;width:2px;background:var(--line)}
.tl li:last-child::after{display:none}
.tl b{font-weight:650}
.tl small{display:block;color:var(--mute);font-size:13.5px}
.ranks .r{display:flex;align-items:center;gap:14px;padding:10px 4px}
.ranks .r.lock{opacity:.38}
.ranks .r b{font-weight:700}
.ranks .r small{display:block;color:var(--mute);font-size:13px}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 72px);transform:translateX(-50%);z-index:80;max-width:calc(100% - 32px);
  animation:tin .3s cubic-bezier(.2,.8,.2,1)}
@keyframes tin{from{transform:translate(-50%,-30px);opacity:0}}
.ask{z-index:70}
.foot-note{text-align:center;font-size:13px;color:var(--dim);margin-top:16px}
.full.acc .foot-note{color:rgba(255,255,255,.62)}
.drift{position:fixed;inset:-20%;z-index:-1;pointer-events:none;
  background:radial-gradient(40% 30% at 20% 10%,rgba(26,75,255,.06),transparent 70%),radial-gradient(40% 30% at 85% 80%,rgba(61,123,255,.06),transparent 70%);
  animation:drift 26s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(4%,-3%) rotate(4deg)}}
/* anatomy figure: outline lines in cool white, muscles near-black, trained muscles lit */
.fig{color:var(--fig-fill);overflow:visible}
.fig [fill="none"]{stroke:var(--fig-line);stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
.fig g.lit{color:var(--fig-lit);animation:breathe 2.6s ease-in-out infinite}
.fig g.lit [fill="none"]{stroke:var(--fig-lit-line)}
@keyframes breathe{50%{opacity:.6}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="drift"></div>
<div id="app"></div>
<script src="figures.js"></script>
<script>
'use strict';
/* ══════════════ STATE ══════════════ */
const KEY='built.l1';
const fresh=()=>({v:1,name:'',who:'man',unit:'kg',target:3,rest:90,onboarded:false,routines:[],sessions:[],active:null,next:0});
let S=load();
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.v===1)return Object.assign(fresh(),s)}catch(e){}return fresh()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let V={view:S.onboarded?'home':'w0'};

/* ══════════════ UTIL ══════════════ */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const keyOf=n=>String(n).toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
const fmtT=t=>new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
const fmtD=t=>new Date(t).toLocaleDateString([],{weekday:'short',day:'numeric',month:'short'});
const dur=ms=>{const m=Math.max(1,Math.round(ms/60000));return m<60?m+' min':Math.floor(m/60)+'h '+(m%60)+'m'};
const clock=ms=>{const s=Math.max(0,Math.floor(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;
  return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0')};
const num=n=>Math.round(n).toLocaleString();
const nkg=v=>{const n=parseFloat(String(v).replace(',','.'));return isFinite(n)&&n>0?n:0};
/* smallest jump you can actually make: dumbbells and light stacks move in 2 kg steps */
const inc=top=>S.unit==='kg'?(top<25?2:2.5):5;
const roundTo=(x,s)=>Math.max(s,Math.round(x/s)*s);
const repsLabel=e=>e.timed?e.repMax+'s':(e.repMin===e.repMax?String(e.repMax):e.repMin+'–'+e.repMax);
const restLabel=s=>s>=60?(s%60?Math.floor(s/60)+':'+String(s%60).padStart(2,'0'):s/60+' min'):s+'s';
const dayKey=t=>{const d=new Date(t);return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
const weekStart=t=>{const d=new Date(t);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d};
const greet=()=>{const h=new Date().getHours();return h<5?'Late night':h<12?'Good morning':h<18?'Good afternoon':'Good evening'};

/* ══════════════ ICONS ══════════════ */
const I={

 crown:'<path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5z"/>',

};
const ic=(n,c='')=>`<svg class="ic ${c}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${I[n]}</svg>`;

/* ══════════════ HUNTER RANK ══════════════
   Every point is earned from logged work. Nothing is bought or assigned. */
const RANKS=[
 {k:'E',n:'E-Rank',lv:1,c:'#9AA0A6',c2:'#5B6066'},
 {k:'D',n:'D-Rank',lv:10,c:'#6FD39B',c2:'#2F7E55'},
 {k:'C',n:'C-Rank',lv:20,c:'#5FB4FF',c2:'#2563B8'},
 {k:'B',n:'B-Rank',lv:35,c:'#9C8CFF',c2:'#4F3FC2'},
 {k:'A',n:'A-Rank',lv:50,c:'#FF7A5C',c2:'#B23A22'},
 {k:'S',n:'S-Rank',lv:70,c:'#F6C945',c2:'#A9790C'},
 {k:'SS',n:'SS-Rank',lv:90,c:'#FF7BE5',c2:'#A21F8A'},
 {k:'M',n:'Monarch',lv:100,c:'#B78CFF',c2:'#2A1150'},
];
const XP_SET=10, XP_QUEST=50, XP_PR=25;
const lvCost=n=>100+20*(n-1);           /* xp to go from level n to n+1 */
function levelOf(xp){let lv=1,rem=xp;while(rem>=lvCost(lv)&&lv<100){rem-=lvCost(lv);lv++}return{lv,rem,need:lvCost(lv)}}
const rankOf=lv=>RANKS.filter(r=>lv>=r.lv).pop();
const nextRank=lv=>RANKS.find(r=>r.lv>lv);
const totalXP=()=>S.sessions.reduce((a,s)=>a+(s.xp||0),0);
function badge(r,size=64){
  const id='g'+r.k+size+Math.random().toString(36).slice(2,6);
  const fs=r.k.length>1?30:38, label=r.k==='M'?'':r.k;
  const crown=r.k==='M'?`<path d="M34 54l9 8 7-14 7 14 9-8-4 20H38z" fill="${r.c}" stroke="#fff" stroke-opacity=".5" stroke-width="1.2"/>`:'';
  const wings=['S','SS','M'].includes(r.k)?`<path d="M14 40 2 30l4 18 10 6zM86 40l12-10-4 18-10 6z" fill="${r.c}" opacity=".75"/>`:'';
  return `<svg class="badge" width="${size}" height="${size}" viewBox="0 0 100 100">
   <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${r.c}"/><stop offset=".55" stop-color="${r.c2}"/><stop offset="1" stop-color="#0B0C0A"/></linearGradient></defs>
   ${wings}
   <path d="M50 4 88 26v48L50 96 12 74V26z" fill="#0F100D" stroke="${r.c}" stroke-width="3"/>
   <path d="M50 13 80 31v38L50 87 20 69V31z" fill="url(#${id})"/>
   <path d="M50 13 80 31 50 49 20 31z" fill="#fff" opacity=".14"/>
   ${crown}
   <text x="50" y="${r.k==='M'?40:50}" dy=".36em" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Inter,sans-serif" font-weight="900" font-size="${fs}" fill="#fff" letter-spacing="-1">${label}</text>
  </svg>`;
}

/* ══════════════ MUSCLES ══════════════ */
const MGN={chest:'Chest',back:'Back',shoulders:'Shoulders',biceps:'Biceps',triceps:'Triceps',forearms:'Forearms',core:'Core',
  legs:'Quads',calves:'Calves',glutes:'Glutes',hams:'Hamstrings'};
const MAP=[
 [/bench|chest|pec|fly|flye|push ?-?up|dip|floor press|incline|decline/,['chest','triceps'],/\bfly|\bflye/],
 [/fly|flye/,['chest']],
 [/incline/,['shoulders']],
 [/shoulder press|overhead|\bohp\b|military|arnold|push press/,['shoulders','triceps']],
 [/shoulder|lateral|delt|face ?pull|upright|front raise|y raise/,['shoulders']],
 [/\brows?\b|pulldown|pull ?-?down|pull ?-?ups?\b|\bchin|\blats?\b|pullover/,['back','biceps']],
 [/shrug|back ext/,['back']],
 [/curl|bicep/,['biceps','forearms'],/leg curl|hamstring curl|nordic/],
 [/hammer|wrist|farmer|carry|dead ?hang/,['forearms']],
 [/tricep|pushdown|push ?-?down|skull|extension|kickback|close ?-?grip/,['triceps'],/leg ext|back ext|hip ext|glute/],
 [/deadlift|rdl|romanian|good ?morning/,['hams','glutes','back']],
 [/squat|leg press|lunge|step ?-?up|leg ext|hack|split|wall sit|sissy/,['legs','glutes']],
 [/leg curl|hamstring|nordic|glute ham/,['hams']],
 [/hip thrust|glute|bridge|abduct/,['glutes']],
 [/calf/,['calves']],
 [/plank|crunch|\babs?\b|hollow|sit ?-?up|knee raise|leg raise|ab wheel|rollout|twist|dead ?bug|core|v ?-?up|mountain/,['core']],
 [/burpee|jumping jack|thruster|clean|snatch|swing/,['legs','shoulders','core']],
];
function musclesOf(name){const k=keyOf(name),out=[];MAP.forEach(([re,g,not])=>{if(re.test(k)&&!(not&&not.test(k)))g.forEach(x=>{if(!out.includes(x))out.push(x)})});return out}

/* anatomy figure (figures.js), trained groups lit.
   Boy and girl reuse the adult drawing with child proportions: head scaled up, body scaled down, split at the neck. */
const GROUPS={
 chest:['upper-pectoralis','mid-lower-pectoralis'],
 shoulders:['anterior-deltoid','lateral-deltoid','posterior-deltoid'],
 biceps:['long-head-bicep','short-head-bicep'],
 triceps:['medial-head-triceps','long-head-triceps','lateral-head-triceps'],
 forearms:['wrist-flexors','wrist-extensors'],
 core:['upper-abdominals','lower-abdominals','obliques'],
 legs:['outer-quadricep','rectus-femoris','inner-quadricep','inner-thigh'],
 calves:['gastrocnemius','tibialis','soleus'],
 back:['upper-trapezius','traps-middle','lower-trapezius','lats','lowerback'],
 glutes:['gluteus-maximus','gluteus-medius'],
 hams:['medial-hamstrings','lateral-hamstrings'],
};
const WHO={man:'Man',woman:'Woman',boy:'Boy',girl:'Girl'};
const NECK_CUT={male:{front:165,back:144},female:{front:181,back:143}};
let figN=0;
function bodySVG(side,lit,who){
  who=who||S.who||'man';
  const sex=who==='woman'||who==='girl'?'female':'male',kid=who==='boy'||who==='girl';
  const ids=lit.flatMap(g=>GROUPS[g]||[]);
  let inner=window.FIG?FIG[sex][side]:'';
  if(ids.length)inner=inner.replace(new RegExp('<g data-m="('+ids.join('|')+')"','g'),'$& class="lit"');
  const id='fg'+(++figN),W=676.49,H=1203.49;
  const defs=`<defs><filter id="${id}" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><style>#${id}s g.lit{filter:url(#${id})}</style>`;
  if(!kid)return `<svg class="fig" id="${id}s" viewBox="0 0 ${W} ${H}">${defs}${inner}</svg>`;
  const c=NECK_CUT[sex][side],hs=1.14,bx=.9,by=.78,top=c-c*hs,bot=c+(H-c)*by,cx=W/2;
  const at=(sx,sy)=>`translate(${cx} ${c}) scale(${sx} ${sy}) translate(${-cx} ${-c})`;
  return `<svg class="fig" id="${id}s" viewBox="0 ${top.toFixed(1)} ${W} ${(bot-top).toFixed(1)}">${defs}
   <clipPath id="${id}h"><rect x="-60" y="-60" width="${W+120}" height="${c+60}"/></clipPath>
   <clipPath id="${id}b"><rect x="-60" y="${c-1}" width="${W+120}" height="${H}"/></clipPath>
   <g transform="${at(bx,by)}"><g clip-path="url(#${id}b)">${inner}</g></g>
   <g transform="${at(hs,hs)}"><g clip-path="url(#${id}h)">${inner}</g></g></svg>`;
}
/* show the side that has more of the work on it first */
function bodies(lit){
  const backish=['back','glutes','hams','triceps','calves'].filter(g=>lit.includes(g)).length;
  const frontish=['chest','shoulders','core','legs','biceps'].filter(g=>lit.includes(g)).length;
  const order=backish>frontish?['back','front']:['front','back'];
  return `<div class="bodies">${order.map((s,i)=>`<div class="${i?'bk':''}">${bodySVG(s,lit)}</div>`).join('')}</div>`;
}

/* ══════════════ PLAN PARSING ══════════════ */
function parseReps(s){
  s=String(s||'').trim().toLowerCase().replace(/\s+/g,'');
  let m=s.match(/^(\d+)(s|sec|secs|seconds)$/);if(m)return{timed:true,repMin:+m[1],repMax:+m[1]};
  m=s.match(/^(\d+)[-–](\d+)$/);if(m){const a=+m[1],b=+m[2];return{timed:false,repMin:Math.min(a,b),repMax:Math.max(a,b)}}
  m=s.match(/^(\d+)$/);if(m)return{timed:false,repMin:+m[1],repMax:+m[1]};
  return null;
}
function parseDur(t){
  t=String(t).trim().toLowerCase();let m;
  if(m=t.match(/^(\d+):(\d{2})$/))return +m[1]*60+ +m[2];
  if(m=t.match(/^(\d+(?:\.\d+)?)\s*(m|min|mins|minutes?)$/))return Math.round(+m[1]*60);
  if(m=t.match(/^(\d+)\s*(s|sec|secs|seconds?)?$/))return +m[1];
  return 0;
}
const blankEx=()=>({id:uid(),name:'',sets:3,repMin:8,repMax:12,timed:false,kg:'',rest:S.rest,note:'',dropLast:0,dropKg:''});
function parseExLine(s){
  const e=blankEx();
  const m=s.match(/(\d+)\s*[x×]\s*(\d+(?:\s*[-–]\s*\d+)?\s*(?:seconds|secs|sec|s)?)(?![a-z])/i);
  if(!m){e.name=s.replace(/\s{2,}.*/,'').trim();return e}
  e.name=s.slice(0,m.index).trim().replace(/[-–:,]+$/,'').trim();
  e.sets=Math.min(12,Math.max(1,+m[1]));
  const r=parseReps(m[2]);if(r)Object.assign(e,r);
  const w=s.slice(m.index+m[0].length).match(/(\d+(?:\.\d+)?)\s*(kg|lbs?)\b/i);
  if(w)e.kg=+w[1];
  return e;
}
function applyNote(e,line){
  e.note=(e.note?e.note+'\n':'')+line;
  let m;
  if(!e.kg&&(m=line.match(/start\w*\s+(?:at\s+)?(\d+(?:\.\d+)?)\s*(kg|lbs?)/i)))e.kg=+m[1];
  if(m=line.match(/drop\w*\s+(?:to\s+)?(\d+(?:\.\d+)?)\s*(kg|lbs?)/i)){
    e.dropKg=+m[1];
    const sm=line.match(/sets?\s+([\d\s+&,and]+)/i);
    const ns=sm?(sm[1].match(/\d+/g)||[]).map(Number).filter(n=>n>=1&&n<=e.sets):[];
    e.dropLast=ns.length?e.sets-Math.min(...ns)+1:1;
  }
}
function parsePlan(text){
  const r={id:uid(),name:'',note:'',warm:[],ex:[]};
  const notes=[];let cur=null,rests=null;
  for(const raw of text.replace(/\r/g,'').split('\n')){
    const line=raw.trim();if(!line)continue;
    const indented=/^(\s{2,}|\t)/.test(raw);let m;
    if(!r.name){m=line.match(/^[^:]{1,12}:\s*(.+)$/);r.name=(m?m[1]:line).trim();continue}
    if(m=line.match(/^warm[\s-]?up\s*[:\-–]\s*(.+)$/i)){r.warm=m[1].split(/\s\+\s|;|,(?![^(]*\))/).map(s=>s.trim()).filter(Boolean);cur=null;continue}
    if(m=line.match(/^rest\s*[:\-–]\s*(.+)$/i)){rests=m[1].split(/[\/|,]/).map(parseDur).filter(x=>x>0);cur=null;continue}
    if(m=line.match(/^\d+\s*[.)]\s*(.+)$/)){cur=parseExLine(m[1]);if(cur.name)r.ex.push(cur);continue}
    if(cur&&(indented||!line.includes(':'))){applyNote(cur,line);continue}
    cur=null;notes.push(line);
  }
  if(rests&&rests.length)r.ex.forEach((e,i)=>e.rest=rests[Math.min(i,rests.length-1)]);
  r.note=notes.join('\n');
  if(!r.name)r.name='My plan';
  return r;
}

/* ══════════════ STARTER PLANS ══════════════ */
const E=(name,sets,reps,rest,note='')=>Object.assign(blankEx(),{name,sets,rest,note},parseReps(reps));
const STARTERS=[
 {name:'Full Body · No Equipment',about:'Anywhere, nothing needed. The E-Rank gate.',warm:['3 min marching or jogging in place','Arm circles 2×15','10 slow bodyweight squats'],
  ex:[E('Push-ups',3,'6-15',75,'Knees down is fine. Chest to fist height.'),E('Bodyweight squats',3,'12-20',60),E('Reverse lunges',3,'8-12',60,'Each leg.'),
      E('Glute bridge',3,'12-15',60,'Squeeze 1 sec at the top.'),E('Plank',3,'30s',45)]},
 {name:'Push · Chest, Shoulders, Triceps',about:'Gym day. Pressing first, isolation after.',warm:['5 min easy cardio','Arm circles 2×15','1 light set of the first lift'],
  ex:[E('Bench press',4,'6-10',120),E('Shoulder press machine',3,'8-12',90),E('Incline dumbbell press',3,'8-12',90),
      E('Lateral raise',3,'12-15',60),E('Triceps pushdown',3,'10-12',60,'Elbows pinned to your sides.')]},
 {name:'Pull · Back, Biceps',about:'Gym day. Vertical pull, horizontal pull, arms.',warm:['5 min rower or easy cardio','Band pull-aparts 2×15'],
  ex:[E('Lat pulldown',4,'8-12',90),E('Seated cable row',3,'8-12',90),E('One-arm dumbbell row',3,'8-12',75,'Each side.'),
      E('Face pull',3,'12-15',60),E('Dumbbell curl',3,'10-12',60)]},
 {name:'Legs · Quads, Hamstrings, Glutes',about:'Gym day. The one people skip.',warm:['5 min bike','10 bodyweight squats','Leg swings 10 each side'],
  ex:[E('Back squat',4,'6-10',150),E('Romanian deadlift',3,'8-10',120),E('Leg press',3,'10-12',90),
      E('Leg curl',3,'10-12',60),E('Standing calf raise',3,'12-15',45)]},
];
const EXAMPLE=`DAY 1: PUSH
First session back, don't chase old numbers.

Warm up: 5 min treadmill + arm circles 2x15

1. Shoulder press machine  4x10-12
   Start 50kg, test 60kg if set 1 feels easy
2. Incline DB press        4x8-10   22kg

   Sets 3 + 4: failure, drop to 10kg
4. Triceps pushdown        4x10-12  41kg

Rest: 90s / 2 min / 90s / 60s`;

/* ══════════════ HISTORY HELPERS ══════════════ */
function lastFor(key){
  for(let i=S.sessions.length-1;i>=0;i--){const s=S.sessions[i];const e=s.ex.find(x=>x.key===key);if(e&&e.log.length)return{ex:e,at:s.inAt}}
  return null;
}
/* double progression: fill the range on every set, then add weight */
function advise(spec,log){
  const w=log.filter(s=>s.reps>0);if(!w.length)return null;
  const top=Math.max(...w.map(s=>nkg(s.kg))),u=S.unit;
  const allHit=w.length>=spec.sets&&w.every(s=>s.reps>=spec.repMax);
  const short=w.some(s=>s.reps<spec.repMin);
  if(spec.timed){
    if(allHit)return{kg:top||'',up:true,msg:`Held ${spec.repMax}s on every set. Push for ${spec.repMax+5}s.`};
    return{kg:top||'',msg:`Build to ${spec.repMax}s on every set.`};
  }
  if(top>0){
    if(allHit){const n=+(top+inc(top)).toFixed(2);return{kg:n,up:true,msg:`${spec.repMax} reps on every set at ${top} ${u} last time. Weight goes up: ${n} ${u}.`}}
    if(short)return{kg:top,msg:`Some sets fell under ${spec.repMin} last time. Stay at ${top} ${u} and own it.`};
    return{kg:top,msg:`Stay at ${top} ${u}. Beat last time by one rep.`};
  }
  if(allHit)return{kg:'',up:true,msg:`Top of the range on every set. Add reps or slow the lowering down.`};
  return{kg:'',msg:`Aim for ${spec.repMax} on every set.`};
}
function suggest(e){const L=lastFor(keyOf(e.name));return(L&&advise(e,L.ex.log))||{kg:e.kg,msg:''}}
function prFor(ex){
  const prev=[];S.sessions.forEach(s=>s.ex.forEach(e=>{if(e.key===ex.key)prev.push(...e.log)}));
  if(!prev.length||!ex.log.length)return null;
  const u=S.unit,best=Math.max(...prev.map(s=>nkg(s.kg))),top=Math.max(...ex.log.map(s=>nkg(s.kg)));
  if(top>best)return`${top} ${u}, heaviest yet`;
  for(const s of ex.log){
    const k=nkg(s.kg),at=prev.filter(p=>nkg(p.kg)===k);
    if(at.length&&s.reps>Math.max(...at.map(p=>p.reps)))return k?`${k} ${u} × ${s.reps}, most reps at this weight`:`${s.reps}${ex.timed?'s':' reps'}, best yet`;
  }
  return null;
}
function weekCount(ws){const a=ws.getTime(),b=new Date(ws).setDate(ws.getDate()+7);return S.sessions.filter(s=>s.inAt>=a&&s.inAt<b).length}
function streak(){
  let w=weekStart(Date.now()),n=weekCount(w)>=S.target?1:0;
  w=new Date(w);w.setDate(w.getDate()-7);
  while(weekCount(w)>=S.target){n++;w.setDate(w.getDate()-7)}
  return n;
}
const nextRoutine=()=>S.routines.length?S.routines[S.next%S.routines.length]:null;
const estMin=r=>Math.round(r.ex.reduce((a,e)=>a+e.sets*(45+e.rest),0)/60+(r.warm.length?6:0));
const routineMuscles=r=>{const o=[];r.ex.forEach(e=>musclesOf(e.name).forEach(g=>{if(!o.includes(g))o.push(g)}));return o};

function weekStrip(){
  const ws=weekStart(Date.now()),hit=new Set(S.sessions.map(s=>dayKey(s.inAt))),today=dayKey(Date.now());

function sessRow(s){return `<button class="it card tap" style="width:100%;text-align:left" data-a="to" data-v="sess" data-id="${s.id}">

function setRow(ei,si,s,drop,cur){

function restSheet(){
  const A=S.active,left=Math.max(0,A.restEnd-Date.now()),C=2*Math.PI*100;
  return `<div class="rest"><div class="in">
   <div class="tag" style="color:var(--mute)">Rest</div>

    <circle class="prg" id="rp" cx="110" cy="110" r="100" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-left/(A.restLen*1000))}"/></svg><b id="rt">${clock(left)}</b></div>

function nextUp(){
  const A=S.active,e=A.ex[A.cur],u=S.unit;
  const j=e.log.findIndex(s=>!s.done);
  if(j>=0){const s=e.log[j];return `Next: set ${j+1} · ${nkg(s.kg)?nkg(s.kg)+' '+u+' × ':''}${repsLabel(e)}`}
  const n=A.ex[A.cur+1];return n?`Next: ${n.name}`:'Last set done. Clear the quest.';
}

/* ══════════════ QUEST ENGINE ══════════════ */
function startSession(rid){
  if(S.active){go(S.active.inAt?(S.active.cur<0?'warm':'ex'):'checkin');return}
  const r=S.routines.find(x=>x.id===rid);if(!r)return;
  S.active={id:uid(),rid,name:r.name,inAt:null,cur:r.warm.length?-1:0,restEnd:null,restLen:0,
    warm:r.warm.map(t=>({t,done:false})),
    ex:r.ex.map(e=>{
      const key=keyOf(e.name),L=lastFor(key),sg=suggest(e);
      const kg=sg.kg!==undefined&&sg.kg!==''?sg.kg:e.kg;
      return{key,name:e.name,sets:e.sets,repMin:e.repMin,repMax:e.repMax,timed:e.timed,rest:e.rest,note:e.note,
        dropLast:+e.dropLast||0,dropKg:e.dropKg,sg,felt:[],
        log:Array.from({length:e.sets},(_,i)=>({kg:kg??'',reps:'',ph:String(L&&L.ex.log[i]?L.ex.log[i].reps:e.repMax),done:false,drop:null}))};
    })};
  save();go('checkin');
}
function hasDrop(e,si){return e.dropLast>0&&si>=e.log.length-e.dropLast&&si<e.sets}
function dropKgFor(e,kg){const d=nkg(e.dropKg);if(d&&d<nkg(kg))return d;const k=nkg(kg);return k?roundTo(k*.8,S.unit==='kg'?(k<20?1:2.5):(k<40?2.5:5)):''}
function startRest(sec){const A=S.active;if(!sec)return;A.restEnd=Date.now()+sec*1000;A.restLen=sec}
function isLastSetOverall(){const A=S.active;return A.ex.every(x=>x.log.every(s=>s.done&&(!s.drop||s.drop.done)))}
function finishSession(){
  const A=S.active;
  const open=A.ex.reduce((a,e)=>a+e.log.filter(s=>!s.done).length,0);
  const any=A.ex.some(e=>e.log.some(s=>s.done));
  if(!any){ask('Nothing logged yet. Abandon this quest? It won\'t be recorded.','Abandon quest',true,()=>{S.active=null;save();go('home')});return}
  if(open)ask(`${open} set${open>1?'s':''} not logged. Clear the quest anyway?`,'Clear quest',false,recordSession);
  else recordSession();
}
function recordSession(){
  const A=S.active;if(!A)return;
  const now=Date.now();
  const ex=A.ex.map(e=>({key:e.key,name:e.name,sets:e.sets,repMin:e.repMin,repMax:e.repMax,timed:e.timed,felt:e.felt,
    log:e.log.filter(s=>s.done).map(s=>({kg:nkg(s.kg),reps:+s.reps||0,drop:s.drop&&s.drop.done?{kg:nkg(s.drop.kg),reps:+s.drop.reps||0}:null}))})).filter(e=>e.log.length);
  const prs=[];ex.forEach(e=>{const t=prFor(e);if(t)prs.push({name:e.name,txt:t})});
  let vol=0,sets=0;ex.forEach(e=>e.log.forEach(s=>{sets++;if(!e.timed)vol+=s.kg*s.reps;if(s.drop){sets++;if(!e.timed)vol+=s.drop.kg*s.drop.reps}}));
  const xp=sets*XP_SET+XP_QUEST+prs.length*XP_PR;
  const rec={id:A.id,rid:A.rid,name:A.name,inAt:A.inAt||now,outAt:now,ex,vol:Math.round(vol),sets,prs,xp,note:''};
  S.sessions.push(rec);
  const ri=S.routines.findIndex(r=>r.id===A.rid);if(ri>=0)S.next=(ri+1)%S.routines.length;
  S.active=null;save();go('done',{sid:rec.id});
}

/* ══════════════ AUDIO ══════════════ */
let AC=null;
function unlockAudio(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}}
function beep(){if(!AC)return;try{[0,.18,.36].forEach((t,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=i===2?1175:880;
  g.gain.setValueAtTime(0,AC.currentTime+t);g.gain.linearRampToValueAtTime(.25,AC.currentTime+t+.02);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+t+.16);
  o.connect(g).connect(AC.destination);o.start(AC.currentTime+t);o.stop(AC.currentTime+t+.18)})}catch(e){}
  if(navigator.vibrate)navigator.vibrate([120,60,120])}

/* ══════════════ ACTIONS ══════════════ */
let backTo='home';
function draftFrom(r){return{id:r.id,isNew:!S.routines.some(x=>x.id===r.id),name:r.name,note:r.note||'',warmTxt:(r.warm||[]).join('\n'),
  ex:r.ex.map(e=>({...e,repsTxt:repsLabel(e)}))}}
function toast(html,ms=2600){const t=document.createElement('div');t.className='toast';t.innerHTML=`<div class="sys">${html}</div>`;document.body.appendChild(t);setTimeout(()=>t.remove(),ms)}
/* in-app confirm: the Claude viewer and some webviews swallow window.confirm */
function ask(msg,okLabel,danger,onOk){
  $$('.ask').forEach(x=>x.remove());
  const m=document.createElement('div');m.className='rest ask';
  m.innerHTML=`<div class="in" style="text-align:left"><p style="font-size:17px;font-weight:650;line-height:1.35">${esc(msg)}</p>
    <div class="two"><button class="btn dark" data-k="no">Cancel</button><button class="btn ${danger?'dark':'acc'}" data-k="ok" style="${danger?'color:var(--warn)':''}">${esc(okLabel)}</button></div></div>`;
  m.addEventListener('click',ev=>{const k=ev.target.closest('[data-k]');if(ev.target===m||k)m.remove();if(k&&k.dataset.k==='ok')onOk()});
  document.body.appendChild(m);
}
function floatXP(el,txt){const r=el.getBoundingClientRect(),f=document.createElement('div');f.className='xpfloat';f.textContent=txt;f.style.left=(r.left+r.width/2-22)+'px';f.style.top=(r.top-6)+'px';document.body.appendChild(f);setTimeout(()=>f.remove(),1000)}

const ACT={
  to:d=>{backTo=V.view==='plan'?'plan':V.view;go(d.v,{id:d.id,prevId:V.id})},
  back:()=>{if(V.view==='edit'&&V.fromPaste)return go('paste',{text:V.text});
    if(backTo==='plan'&&V.prevId)return go('plan',{id:V.prevId});go(['home','plans','history','me','starters','paste'].includes(backTo)?backTo:'home')},
  tab:d=>{backTo=d.v;go(d.v)},
  w1:()=>go('w1'),
  w2:()=>{const n=$('#nm').value.trim();if(!n){$('#nm').focus();return}S.name=n;save();go('w2')},
  unit:d=>{S.unit=d.v;save();render()},
  who:d=>{S.who=d.v;save();render()},
  target:d=>{S.target=+d.v;save();render()},
  onbPick:d=>{S.onboarded=true;save();backTo='home';if(d.v==='paste')go('paste');else if(d.v==='starter')go('starters');else ACT.newPlan()},
  quick:()=>{if(S.active)return ACT.resume();const r=nextRoutine();if(r)startSession(r.id);else go('plans')},
  start:d=>startSession(d.v),
  resume:()=>{const A=S.active;go(!A.inAt?'checkin':A.cur<0?'warm':'ex')},
  leave:()=>go('home'),
  checkIn:()=>{unlockAudio();S.active.inAt=Date.now();save();go(S.active.cur<0?'warm':'ex');toast(`<div class="t">System</div><p>[Checked in at ${fmtT(S.active.inAt)}. The record is open.]</p>`)},
  warmT:d=>{const w=S.active.warm[+d.i];w.done=!w.done;save();render()},
  warmDone:()=>{S.active.cur=0;save();go('ex')},
  goEx:d=>{S.active.cur=+d.i;save();go('ex')},
  prevEx:()=>{const A=S.active;if(A.cur===0){if(A.warm.length){A.cur=-1;save();go('warm')}return}A.cur--;save();go('ex')},
  nextEx:()=>{S.active.cur++;save();go('ex')},
  finish:()=>finishSession(),
  check:(d,el)=>{
    unlockAudio();
    const A=S.active,e=A.ex[+d.e],s=e.log[+d.s],o=d.d?s.drop:s;
    if(o.done){o.done=false;if(!d.d&&s.drop&&!s.drop.done)s.drop=null;A.restEnd=null;save();render();return}
    if(!String(o.reps).trim())o.reps=o.ph;
    o.reps=String(parseInt(o.reps)||0);
    if(!+o.reps){toast('<p>Enter how many you did first.</p>');return}
    o.done=true;
    floatXP(el,'+'+XP_SET+' XP');
    if(!d.d&&hasDrop(e,+d.s)&&!s.drop){
      s.drop={kg:dropKgFor(e,s.kg),reps:'',ph:String(Math.max(1,Math.round(+s.reps*.75))),done:false};
      save();render();focusCur();toast('<div class="t">Drop set</div><p>[Strip the weight. Go again now. No rest.]</p>');return;
    }
    if(!isLastSetOverall())startRest(e.rest);
    save();render();focusCur();
    if(e.log.every(x=>x.done&&(!x.drop||x.drop.done))&&A.cur<A.ex.length-1&&!A.restEnd)toast(`<p>${esc(e.name)} cleared.</p>`);
  },
  addSet:()=>{const e=S.active.ex[S.active.cur],l=e.log[e.log.length-1];e.log.push({kg:l?l.kg:'',reps:'',ph:l?(l.reps||l.ph):String(e.repMax),done:false,drop:null});save();render()},
  felt:(d,el)=>{const e=S.active.ex[S.active.cur],i=e.felt.indexOf(d.v);if(i>=0)e.felt.splice(i,1);else e.felt.push(d.v);save();el.classList.toggle('on')},
  restAdd:()=>{const A=S.active;A.restEnd+=15000;A.restLen+=15;save()},
  restSkip:()=>{S.active.restEnd=null;save();render()},
  /* plans */
  newPlan:()=>{backTo=V.view;go('edit',{draft:{id:uid(),isNew:true,name:'',note:'',warmTxt:'',ex:[{...blankEx(),repsTxt:'8-12'}]}})},
  editPlan:d=>{backTo='plan';go('edit',{draft:draftFrom(S.routines.find(r=>r.id===d.id)),prevId:d.id})},
  delPlan:d=>{const r=S.routines.find(x=>x.id===d.id);ask(`Delete "${r.name}"? Your logged sessions stay.`,'Delete plan',true,()=>{
    S.routines=S.routines.filter(x=>x.id!==d.id);S.next=0;save();go('plans')})},
  setNext:d=>{S.next=S.routines.findIndex(r=>r.id===d.id);save();toast('<p>Set as your next quest.</p>');go('home')},
  pasteExample:()=>{$('#pt').value=EXAMPLE},
  readPlan:()=>{const t=$('#pt').value;if(!t.trim()){$('#pt').focus();return}
    const r=parsePlan(t);if(!r.ex.length){toast('<p>[No exercises found. Number each one: "1. Bench press 4x8-10".]</p>',3600);return}
    go('edit',{draft:draftFrom(r),fromPaste:true,text:t})},
  exAdd:()=>{V.draft.ex.push({...blankEx(),repsTxt:'8-12'});render();const ins=$$('[data-x="name"]');ins[ins.length-1].focus()},
  exDel:d=>{V.draft.ex.splice(+d.i,1);render()},
  exUp:d=>{const i=+d.i,x=V.draft.ex;if(i>0){[x[i-1],x[i]]=[x[i],x[i-1]];render()}},
  exDown:d=>{const i=+d.i,x=V.draft.ex;if(i<x.length-1){[x[i+1],x[i]]=[x[i],x[i+1]];render()}},
  savePlan:()=>{
    const d=V.draft,errs=[];
    if(!d.name.trim())errs.push('Give the plan a name.');
    const ex=d.ex.filter(e=>e.name.trim()).map((e,i)=>{
      const r=parseReps(e.repsTxt);if(!r)errs.push(`Reps for "${e.name}" should look like 8-12, 10 or 30s.`);
      return{id:e.id||uid(),name:e.name.trim(),sets:Math.min(12,Math.max(1,parseInt(e.sets)||3)),...(r||{timed:false,repMin:8,repMax:12}),
        kg:nkg(e.kg)||'',rest:Math.max(0,parseInt(e.rest)||0),note:(e.note||'').trim(),dropLast:+e.dropLast||0,dropKg:nkg(e.dropKg)||''};
    });
    if(!ex.length)errs.push('Add at least one exercise.');
    if(errs.length){toast(`<p>${errs.map(esc).join('<br>')}</p>`,4000);return}
    const r={id:d.id,name:d.name.trim(),note:d.note.trim(),warm:d.warmTxt.split('\n').map(s=>s.trim()).filter(Boolean),ex};
    const i=S.routines.findIndex(x=>x.id===r.id);if(i>=0)S.routines[i]=r;else S.routines.push(r);
    S.onboarded=true;save();backTo='plans';go('plan',{id:r.id});
    toast('<div class="t">System</div><p>[Plan written to your record.]</p>');
  },
  addStarter:d=>{const p=STARTERS[+d.i];addStarterPlan(p);S.onboarded=true;save();toast(`<p>Added ${esc(p.name)}.</p>`);go('home')},
  addPPL:()=>{[1,2,3].forEach(i=>addStarterPlan(STARTERS[i]));S.onboarded=true;save();toast('<p>Push, Pull and Legs added. They run in that order.</p>');go('home')},
  mon:d=>{const now=new Date();let y=V.y??now.getFullYear(),m=(V.m??now.getMonth())+ +d.v;if(m<0){m=11;y--}if(m>11){m=0;y++}go('history',{y,m})},
  delSess:d=>ask('Delete this session? Its XP goes with it.','Delete session',true,()=>{S.sessions=S.sessions.filter(s=>s.id!==d.id);save();go('history')}),
  export:()=>{
    const name=`gatelift-backup-${new Date().toISOString().slice(0,10)}.json`,blob=new Blob([JSON.stringify(S)],{type:'application/json'});
    try{const f=new File([blob],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:'GATELIFT backup'}).catch(()=>{});return}}catch(e){}
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
  },
  reset:()=>ask('Erase every plan, session and rank on this device? This cannot be undone.','Erase everything',true,()=>{try{localStorage.removeItem(KEY)}catch(e){}S=fresh();go('w0')}),
};
/* keep the set you're on above the bottom bar */
function focusCur(){const c=$('.set.cur');if(!c)return;const r=c.getBoundingClientRect();
  if(r.bottom>innerHeight-200||r.top<80)window.scrollBy({top:r.top-innerHeight/2+60,behavior:'smooth'})}
function addStarterPlan(p){S.routines.push({id:uid(),name:p.name,note:p.about,warm:[...p.warm],ex:p.ex.map(e=>({...e,id:uid()}))})}

document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-a]');if(!el||el.disabled)return;
  const f=ACT[el.dataset.a];if(f){ev.preventDefault();f(el.dataset,el)}
});
document.addEventListener('input',ev=>{
  const t=ev.target,ds=t.dataset;
  if(ds.in&&S.active){
    const e=S.active.ex[+ds.e],s=e.log[+ds.s],o=ds.d?s.drop:s,old=o[ds.in];
    o[ds.in]=t.value.replace(',','.');
    if(ds.in==='kg'&&!ds.d)for(let j=+ds.s+1;j<e.log.length;j++){const n=e.log[j];
      if(!n.done&&String(n.kg)===String(old)){n.kg=o.kg;const inp=$(`input[data-in="kg"][data-e="${ds.e}"][data-s="${j}"]:not([data-d])`);if(inp)inp.value=o.kg}}
    save();return;
  }
  if(ds.d&&V.draft&&!ds.in){V.draft[ds.d]=t.value;return}
  if(ds.x&&V.draft){V.draft.ex[+ds.i][ds.x]=t.value;return}
  if(ds.set){S[ds.set]=ds.set==='rest'?Math.max(0,parseInt(t.value)||0):t.value.trim();save();return}
  if(ds.snote){const s=S.sessions.find(x=>x.id===ds.snote);if(s){s.note=t.value;save()}}
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.dataset.x&&V.draft){V.draft.ex[+t.dataset.i][t.dataset.x]=t.value;return}
  if(t.dataset.aFile==='import'&&t.files[0]){
    const rd=new FileReader();rd.onload=()=>{try{const d=JSON.parse(rd.result);if(d.v!==1||!Array.isArray(d.sessions))throw 0;
      ask(`Replace everything on this device with this backup (${d.sessions.length} sessions, ${d.routines.length} plans)?`,'Restore backup',true,()=>{
      S=Object.assign(fresh(),d);save();go('home');toast('<p>Backup restored.</p>')})}catch(e){toast('<p>That file isn\'t a GATELIFT backup.</p>')}};
    rd.readAsText(t.files[0]);
  }
});

/* ══════════════ TICK + MOTION ══════════════ */
function afterRender(){
  requestAnimationFrame(()=>$$('.xpbar i').forEach(i=>i.style.width=i.dataset.w+'%'));
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  $$('[data-count]').forEach(el=>{
    const to=+el.dataset.count;if(reduce||!to){el.textContent=num(to);return}
    const t0=performance.now(),D=750;
    const step=t=>{const p=Math.min(1,(t-t0)/D),v=to*(1-Math.pow(1-p,3));el.textContent=num(v);if(p<1)requestAnimationFrame(step)};
    requestAnimationFrame(step);
  });
}
setInterval(()=>{
  const A=S.active;if(!A)return;
  const c=$('[data-clock]');if(c&&A.inAt)c.textContent=clock(Date.now()-A.inAt);
  if(A.restEnd){
    const left=A.restEnd-Date.now();
    if(left<=0){A.restEnd=null;save();beep();if(V.view==='ex')render();return}
    const rt=$('#rt'),rp=$('#rp'),rr=$('#rring');
    if(rt){rt.textContent=clock(left+999);const C=2*Math.PI*100;rp.style.strokeDashoffset=C*(1-left/(A.restLen*1000));rr.classList.toggle('hot',left<10000)}
  }
},250);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.active&&V.view==='ex')render()});

/* an open quest survives closing the app */
if(S.onboarded&&S.active)V={view:'home'};
render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
