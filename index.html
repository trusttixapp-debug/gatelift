<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0B0D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GATELIFT">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>GATELIFT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100,500;100,700;100,800;125,800&display=swap">
<style>
/* One dark look, one accent. The grey body is the hero of every screen; volt marks what you train. */
:root{color-scheme:dark;
  --bg:#0A0B0D;--card:#131518;--card2:#1A1D21;--card3:#23272C;--line:#24282D;
  --text:#F2F4F6;--mute:#9BA2AB;--dim:#5E656E;
  --acc:#C8FF2E;--acc-d:#9FD400;--acc-ink:#0A0B0D;--acc-soft:rgba(200,255,46,.12);
  --warn:#FF6A4D;
  --r:22px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,"Segoe UI",Roboto,system-ui,sans-serif;
  --disp:"Archivo","SF Pro Display",-apple-system,"Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
body{min-height:100dvh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{max-width:480px;margin:0 auto;min-height:100dvh;position:relative}
.v{padding:calc(env(safe-area-inset-top,0px) + 18px) max(18px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 96px) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
h1,h2,h3,.disp{font-family:var(--disp);font-stretch:100%;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:30px;font-weight:800;line-height:1.05}
h2{font-size:20px;font-weight:700}
h3{font-size:16px;font-weight:700}
.lbl{font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--dim)}
.mute{color:var(--mute)}.dim{color:var(--dim)}.acc{color:var(--acc)}
.row{display:flex;align-items:center;gap:10px}.sp{flex:1;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:54px;border-radius:18px;background:var(--acc);color:var(--acc-ink);font-family:var(--disp);font-weight:800;font-size:16px;letter-spacing:.02em;width:100%}
.btn:active{transform:scale(.985)}
.btn.ghost{background:var(--card2);color:var(--text);border:1px solid var(--line)}
.btn[disabled]{opacity:.35}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:99px;background:var(--card2);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--mute);white-space:nowrap}
.chip.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.chips{display:flex;gap:8px;flex-wrap:wrap;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.tag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:var(--acc-soft);color:var(--acc)}
.ic{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:var(--card2);color:var(--mute);flex:none}
.ic.on{background:var(--acc);color:var(--acc-ink)}

/* ── the body ── */
.fig{display:block;overflow:visible}
.fig .bs path,.fig .bs ellipse,.fig .bs rect{fill:#34383E;stroke:#34383E;stroke-width:20;stroke-linejoin:round}
.fig .bs line,.fig .bs [fill="none"]{display:none}
.fig .ms path:not([fill="none"]),.fig .ms ellipse,.fig .ms rect{fill:url(#gMus);stroke:#141619;stroke-width:2.6;stroke-linejoin:round}
.fig .ms .fx ellipse,.fig .ms .fx rect{fill:url(#gJoint)}
.fig .ms .dim path:not([fill="none"]){fill:url(#gDim);stroke:#2E3A0C}
.fig .ms .on path:not([fill="none"]){fill:url(#gLit);stroke:#3F5A00}
.fig .ms .sel path:not([fill="none"]){fill:url(#gLit);stroke:#fff;stroke-width:4}
.fig .ms [fill="none"],.fig .ms line{stroke:#141619;stroke-width:2.4;fill:none}
.fig .gw{filter:url(#fGlow);opacity:.8}
.fig .gw path{fill:var(--acc)}.fig .gw [fill="none"],.fig .gw line{display:none}
.fig.tap .ms g[data-m]{cursor:pointer}
.stage{position:relative;border-radius:28px;overflow:hidden;background:radial-gradient(120% 80% at 50% 38%,#2A2E33 0%,#15171A 48%,#0C0D0F 100%);border:1px solid var(--line)}
.stage .floor{position:absolute;left:18%;right:18%;bottom:14px;height:22px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.65),transparent)}
.pair{display:flex;justify-content:center;align-items:flex-end;gap:2px;padding:18px 0 22px;position:relative}
.pair .fig{height:250px;width:auto}
.pair[style*="absolute"] .fig{height:100%}

/* ── tab bar ── */
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;gap:4px;padding:5px;background:rgba(20,22,25,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:99px;z-index:20}
.tabs button{height:42px;min-width:52px;padding:0 14px;border-radius:99px;display:flex;align-items:center;gap:7px;color:var(--dim);font-size:13px;font-weight:700}
.tabs button.on{background:var(--acc);color:var(--acc-ink)}
.tabs button span{display:none}.tabs button.on span{display:inline}

/* ── today ── */
.hello{display:flex;align-items:flex-end;gap:12px}
.streak{display:flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:14px}
.streak svg{color:var(--acc);width:18px;height:18px}
.hero-t{position:absolute;left:18px;top:16px;right:18px;display:flex;justify-content:space-between;align-items:flex-start;z-index:2}
.hero-b{position:absolute;left:18px;right:18px;bottom:16px;z-index:2}
.musc{display:flex;gap:6px;flex-wrap:wrap}
.musc span{font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;background:rgba(10,11,13,.6);border:1px solid rgba(200,255,46,.35);color:var(--acc)}
.steps{display:flex;flex-direction:column;gap:8px}
.st{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:18px;text-align:left;width:100%}
.st .n{font-family:var(--disp);font-weight:800;font-size:13px;color:var(--dim);width:16px}
.st b{display:block;font-weight:700;font-size:15px}
.st small{display:block;color:var(--mute);font-size:13px}
.st .ok{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.st .ok.y{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.st .ok svg{width:15px;height:15px;stroke-width:3}
.next{display:flex;gap:14px;align-items:center;overflow:hidden}
.next .fig{height:96px;width:auto;margin:-6px -4px -10px}

/* ── body tab ── */
.bodyv .stage{height:min(62vh,560px)}
.bodyv .fig{height:calc(100% - 40px);width:auto;margin:20px auto 0}
.rot{position:absolute;right:14px;bottom:14px;z-index:3;height:44px;padding:0 16px;border-radius:99px;background:var(--acc);color:var(--acc-ink);display:flex;align-items:center;gap:8px;font-weight:800;font-family:var(--disp)}
.side{position:absolute;left:14px;bottom:14px;z-index:3}
.legend{position:absolute;left:14px;top:14px;z-index:3;display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--mute)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.mlist{display:flex;flex-direction:column}
.mlist .it{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.mlist .it:first-child{border-top:0}
.bar{height:6px;border-radius:9px;background:var(--card3);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:9px}

/* ── run ── */
.runh{position:sticky;top:0;z-index:10;background:rgba(10,11,13,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:calc(env(safe-area-inset-top,0px) + 10px) max(18px,env(safe-area-inset-right,0px)) 12px max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;border-bottom:1px solid var(--line)}
.prog{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.prog button{display:flex;flex-direction:column;gap:7px;text-align:left;font-size:12px;font-weight:700;color:var(--dim);letter-spacing:.04em;text-transform:uppercase}
.prog button i{display:block;height:4px;border-radius:4px;background:var(--card3)}
.prog button.done i{background:var(--acc-d)}
.prog button.on{color:var(--text)}.prog button.on i{background:var(--acc)}
.clock{font-family:var(--disp);font-weight:800;font-variant-numeric:tabular-nums}
.sx{display:flex;align-items:center;gap:12px;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:18px}
.sx.act{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.sx.dn{opacity:.55}
.sx .fig{height:64px;width:auto;flex:none;margin:-4px 0}
.sx b{display:block;font-size:15px}
.sx small{display:block;font-size:13px;color:var(--mute)}
.pbtn{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--card3);flex:none;position:relative}
.pbtn.on{background:var(--acc);color:var(--acc-ink)}
.pbtn svg.ring{position:absolute;inset:-3px;width:52px;height:52px;transform:rotate(-90deg)}
.pbtn .t{font-family:var(--disp);font-weight:800;font-size:13px}
.big{display:flex;flex-direction:column;align-items:center;gap:6px;padding:22px 0 8px}
.big .clock{font-size:64px;line-height:1}
.dial{position:relative;width:230px;height:230px;display:grid;place-items:center}
.dial svg{position:absolute;inset:0;transform:rotate(-90deg)}
.field{display:flex;flex-direction:column;gap:6px}
.field input{height:48px;border-radius:14px;background:var(--card2);border:1px solid var(--line);padding:0 14px;outline:none;font-size:16px}
.field input:focus{border-color:var(--acc)}
.ex{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.ex.alldone{border-color:rgba(200,255,46,.35)}
.exh{display:flex;gap:12px;align-items:center;text-align:left}
.exh .thumb{width:58px;height:70px;border-radius:14px;background:radial-gradient(circle at 50% 35%,#2A2E33,#101113);display:grid;place-items:center;overflow:hidden;flex:none}
.exh .thumb .fig{height:66px;width:auto}
.exh b{font-size:16px;display:block}
.exh small{font-size:13px;color:var(--mute);display:block}
.sets{display:grid;grid-template-columns:28px 1fr 1fr 44px;gap:6px 8px;align-items:center}
.sets .hd{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--dim);text-transform:uppercase;text-align:center}
.sets .no{font-family:var(--disp);font-weight:800;color:var(--dim);text-align:center}
.sets input{width:100%;height:42px;border-radius:12px;background:var(--card2);border:1px solid var(--line);text-align:center;font-size:16px;font-weight:700;outline:none;font-variant-numeric:tabular-nums}
.sets input:focus{border-color:var(--acc)}
.sets input::placeholder{color:var(--dim);font-weight:600}
.sets .tk{width:44px;height:42px;border-radius:12px;background:var(--card3);display:grid;place-items:center;color:var(--dim)}
.sets .tk.y{background:var(--acc);color:var(--acc-ink)}
.sets .tk svg{stroke-width:3}
.sets .row-ok input{background:var(--acc-soft);border-color:transparent}
.addset{font-size:13px;font-weight:700;color:var(--mute);display:flex;align-items:center;gap:6px;padding:4px 0}
.addset svg{width:16px;height:16px}
.last{font-size:12.5px;color:var(--mute);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:15;padding:12px max(18px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(18px,env(safe-area-inset-left,0px));background:linear-gradient(transparent,var(--bg) 30%)}
.foot>div{max-width:444px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.restbar{display:flex;align-items:center;gap:12px;padding:10px 12px 10px 16px;border-radius:18px;background:var(--card2);border:1px solid var(--acc)}
.restbar .clock{font-size:24px;color:var(--acc)}
.restbar button{height:36px;padding:0 12px;border-radius:12px;background:var(--card3);font-weight:700;font-size:13px}
.x{width:40px;height:40px;border-radius:50%;background:var(--card2);display:grid;place-items:center;flex:none}

/* ── sheet ── */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:480px;max-height:88dvh;overflow:auto;background:var(--card);border-radius:28px 28px 0 0;border:1px solid var(--line);border-bottom:0;padding:10px max(18px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 20px) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.grab{width:40px;height:5px;border-radius:9px;background:var(--card3);margin:0 auto 4px}
.howto{display:flex;flex-direction:column;gap:10px;counter-reset:s}
.howto li{list-style:none;display:flex;gap:12px;font-size:15px;color:var(--mute)}
.howto li::before{counter-increment:s;content:counter(s);font-family:var(--disp);font-weight:800;color:var(--acc);width:18px;flex:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card2);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--disp);font-size:20px;font-weight:800}
.stat small{font-size:12px;color:var(--mute)}

/* ── log ── */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.week div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--dim);font-weight:600}
.week i{width:34px;height:34px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-style:normal;color:var(--mute);font-weight:700;font-size:13px}
.week i.y{background:var(--acc);color:var(--acc-ink)}
.week i.t{box-shadow:0 0 0 2px var(--acc) inset}
.sess{display:flex;align-items:center;gap:12px;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:18px;text-align:left;width:100%}
.sess .d{width:46px;text-align:center;flex:none}
.sess .d b{display:block;font-family:var(--disp);font-size:20px;font-weight:800;line-height:1}
.sess .d small{font-size:11px;color:var(--dim);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.trio{display:flex;gap:4px;margin-top:6px}
.trio span{font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;background:var(--card3);color:var(--dim)}
.trio span.y{background:var(--acc-soft);color:var(--acc)}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl td{padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.tbl td:last-child{text-align:right;color:var(--mute)}

/* ── onboarding ── */
.ob{min-height:100dvh;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 18px) max(20px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 20px) max(20px,env(safe-area-inset-left,0px));gap:18px}
.ob .grow{flex:1;display:flex;flex-direction:column;gap:18px}
.wordmark{font-family:var(--disp);font-stretch:125%;font-weight:800;font-size:15px;letter-spacing:.18em}
.wordmark i{color:var(--acc);font-style:normal}
.dots{display:flex;gap:6px}.dots i{height:4px;flex:1;border-radius:4px;background:var(--card3)}.dots i.on{background:var(--acc)}
.opt{display:flex;align-items:center;gap:14px;padding:16px;border-radius:18px;background:var(--card);border:1px solid var(--line);text-align:left;width:100%}
.opt.on{border-color:var(--acc);background:linear-gradient(var(--acc-soft),var(--acc-soft)),var(--card)}
.opt b{display:block;font-size:16px}.opt small{display:block;color:var(--mute);font-size:13px}
.opt .rad{width:22px;height:22px;border-radius:50%;border:2px solid var(--dim);flex:none}
.opt.on .rad{border:7px solid var(--acc)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;padding:4px;background:var(--card);border:1px solid var(--line);border-radius:16px}
.seg button{height:44px;border-radius:12px;font-weight:700;color:var(--mute)}
.seg button.on{background:var(--acc);color:var(--acc-ink)}
.welcome .stage{flex:1;min-height:340px;display:flex;align-items:center;justify-content:center}
.welcome .fig{height:min(52vh,470px);width:auto}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translateX(-50%);background:var(--acc);color:var(--acc-ink);font-weight:800;padding:10px 16px;border-radius:99px;z-index:60;font-size:14px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
 <defs>
  <radialGradient id="gMus" cx=".38" cy=".3" r=".85"><stop offset="0" stop-color="#B6BCC4"/><stop offset=".45" stop-color="#7C828A"/><stop offset="1" stop-color="#3E434A"/></radialGradient>
  <radialGradient id="gJoint" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#7E848C"/><stop offset="1" stop-color="#383C42"/></radialGradient>
  <radialGradient id="gLit" cx=".38" cy=".3" r=".85"><stop offset="0" stop-color="#F6FFB8"/><stop offset=".4" stop-color="#D4FF3A"/><stop offset="1" stop-color="#86B800"/></radialGradient>
  <radialGradient id="gDim" cx=".38" cy=".3" r=".85"><stop offset="0" stop-color="#C9D98E"/><stop offset=".5" stop-color="#8FA247"/><stop offset="1" stop-color="#4A5626"/></radialGradient>
  <clipPath id="cut-male-front"><rect x="-60" y="165" width="820" height="1100"/></clipPath>
  <clipPath id="cut-male-back"><rect x="-60" y="146" width="820" height="1100"/></clipPath>
  <clipPath id="cut-female-front"><rect x="-60" y="176" width="820" height="1100"/></clipPath>
  <clipPath id="cut-female-back"><rect x="-60" y="150" width="820" height="1100"/></clipPath>
  <filter id="fGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
 </defs>
</svg>
<div id="app"></div>
<script src="figures.js"></script>
<script>
/* ══════════════ STATE ══════════════ */
const KEY='gatelift.v2';
const fresh=()=>({v:2,onb:false,name:'',sex:'male',days:3,place:'gym',unit:'kg',cardio:10,cardioType:'',idx:0,log:[],cur:null});
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.v===2)return Object.assign(fresh(),s)}catch(e){}return fresh()}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let V={view:S.onb?'tab':'ob',tab:'today',ob:0,side:'front',sel:null,sheet:null,rest:null,str:null,logId:null,toast:''};

/* ══════════════ MUSCLES ══════════════ */
const G={chest:['upper-pectoralis','mid-lower-pectoralis'],shoulders:['anterior-deltoid','lateral-deltoid','posterior-deltoid'],
 biceps:['long-head-bicep','short-head-bicep'],triceps:['medial-head-triceps','long-head-triceps','lateral-head-triceps'],
 forearms:['wrist-flexors','wrist-extensors'],abs:['upper-abdominals','lower-abdominals'],obliques:['obliques'],
 traps:['upper-trapezius','traps-middle','lower-trapezius'],lats:['lats'],lowerback:['lowerback'],
 glutes:['gluteus-maximus','gluteus-medius'],quads:['outer-quadricep','rectus-femoris','inner-quadricep'],

  c.ex=c.ex.map(e=>({id:e.id,sets:e.sets.filter(s=>s.ok||s.w||s.r)})).filter(e=>e.sets.length);
  c.pr=prsOf(c);
  S.log.push(c);if(setsOf(c))S.idx++;S.cur=null;V.rest=null;V.str=null;V.view='done';V.doneId=c.id;save();render();
}
function prsOf(c){const out=[];c.ex.forEach(e=>{const best=Math.max(0,...doneSets(e).map(s=>+s.w||0));if(!best)return;
  const prev=Math.max(0,...S.log.flatMap(x=>(x.ex||[]).filter(y=>y.id===e.id).flatMap(y=>doneSets(y).map(s=>+s.w||0))));
  if(best>prev&&prev>0)out.push({id:e.id,w:best})});return out}
/* double progression: every set at the top of the range means add weight */
function hint(id){const last=lastFor(id);if(!last)return '';const R=parseR(EX[id].r),ok=doneSets(last);
  if(R.hold)return ok.every(s=>+s.r>=R.hi)?'Hold 5s longer':'';
  return ok.length>=EX[id].s&&ok.every(s=>+s.r>=R.hi)?`Go up ${S.unit==='lb'?'5 lb':'2.5 kg'}`:'';}

}

/* ── today ── */

     <div class="hero-t"><div><span class="tag">${tag}</span><h2 style="margin-top:8px;font-size:28px;font-weight:800">${DAYS[heroK].n} day</h2></div></div>

     ${step(3,'lift',`Lift · ${D.n}`,`${plural(ex.length,'exercise')} · ${nSets} sets`,c&&exDone===ex.length,c&&exDone&&exDone<ex.length?`${exDone}/${ex.length}`:'')}

/* ── run: stretch → cardio → lift ── */
function run(){
  const c=S.cur,D=DAYS[c.k];

     <div class="sp"><div class="lbl">${D.n} day</div><div class="clock" id="tot" style="font-size:18px">${mmss((Date.now()-c.t0)/1000)}</div></div>

     <div class="prog">${['Stretch','Cardio','Lift'].map((l,i)=>`<button class="${c.step===i?'on':''} ${stepsDone[i]?'done':''}" data-a="goStep" data-v="${i}"><i></i>${l}</button>`).join('')}</div></div>`;

        `<button class="pbtn ${act?'on':''}" data-a="stPlay" data-v="${id}" aria-label="${act?'Pause':'Start'}">${act?`<span class="t" id="stt">${Math.ceil((V.str.end-Date.now())/1000)}</span><svg class="ring" viewBox="0 0 52 52"><circle cx="26" cy="26" r="24" fill="none" stroke="rgba(10,11,13,.25)" stroke-width="3"/><circle id="str" cx="26" cy="26" r="24" fill="none" stroke="#0A0B0D" stroke-width="3" stroke-dasharray="150.8" stroke-dashoffset="0" stroke-linecap="round"/></svg>`:ic('play')}</button>`}
      </div>`}).join('')}`;
    foot=`<button class="btn" data-a="goStep" data-v="1">${stepsDone[0]?'Next: cardio':'Skip to cardio'}</button>`;
  }else if(c.step===1){

    body=`<div><h2>Cardio</h2><p class="mute" style="font-size:14px;margin-top:4px">Easy pace. You should be able to talk.</p></div>
     <div class="chips">${CARDIO[S.place==='home'?'home':'gym'].map(t=>`<button class="chip ${ca.type===t?'on':''}" data-a="caType" data-v="${esc(t)}">${esc(t)}</button>`).join('')}</div>
     <div class="big"><div class="dial"><svg viewBox="0 0 230 230"><circle cx="115" cy="115" r="104" fill="none" stroke="var(--card3)" stroke-width="10"/><circle id="car" cx="115" cy="115" r="104" fill="none" stroke="var(--acc)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C*(1-pct)).toFixed(1)}"/></svg>
       <div style="text-align:center"><div class="clock" id="cat" style="font-size:52px">${mmss(sec)}</div><div class="mute" style="font-size:13px">of ${ca.goal}:00</div></div></div>
       <div class="row" style="gap:14px;margin-top:8px"><button class="pbtn ${ca.run?'':'on'}" style="width:64px;height:64px" data-a="caRun" aria-label="${ca.run?'Pause':'Start'}">${ic(ca.run?'pause':'play')}</button></div></div>
     <div class="lbl">Target</div>
     <div class="seg">${[5,10,15,20,30].map(m=>`<button class="${ca.goal===m?'on':''}" data-a="caGoal" data-v="${m}">${m}m</button>`).join('')}</div>
     <div class="field"><span class="lbl">Distance (optional)</span><input inputmode="decimal" placeholder="${S.unit==='lb'?'miles':'km'}" value="${esc(ca.dist)}" data-in="dist"></div>`;
    foot=`<button class="btn" data-a="caDone">${ca.done?'Next: lift':'Done, on to lifting'}</button>`;
  }else{
    body=`<div class="row"><div class="sp"><h2>${D.n}</h2><p class="mute" style="font-size:14px;margin-top:4px">Tick each set as you finish it. Rest starts on its own.</p></div></div>

function exCard(e,i){
  const X=EX[e.id],R=parseR(X.r),last=lastFor(e.id),h=hint(e.id),all=e.sets.length&&e.sets.every(s=>s.ok);

  return `<div class="ex ${all?'alldone':''}">
   <button class="exh" data-a="exInfo" data-v="${e.id}"><span class="thumb">${fig(bestSide(X.m),{[X.m[0]]:2,...Object.fromEntries(X.m.slice(1).map(g=>[g,1]))},{noglow:true})}</span>
    <span class="sp"><b>${X.n}</b><small>${X.s} × ${X.r} · rest ${X.rest>=60?`${X.rest/60} min`.replace('.5',':30'):X.rest+'s'}</small>
    ${last?`<span class="last">Last: ${lastTxt}${h?` <span class="tag">${h}</span>`:''}</span>`:`<span class="last">First time. Pick a weight you could lift 2 more reps with.</span>`}</span>${ic('chev','dim')}</button>
   <div class="sets"><span class="hd">Set</span><span class="hd">${R.hold?'Added':S.unit}</span><span class="hd">${R.hold?'Secs':'Reps'}</span><span></span>
    ${e.sets.map((s,j)=>{const ls=last&&doneSets(last)[j];return `<span class="no">${j+1}</span>
     <input inputmode="decimal" placeholder="${ls&&ls.w?ls.w:'–'}" value="${esc(s.w)}" data-in="w" data-e="${i}" data-s="${j}" class="${s.ok?'okc':''}" ${s.ok?'style="background:var(--acc-soft);border-color:transparent"':''}>
     <input inputmode="numeric" placeholder="${ls?ls.r:R.hi}" value="${esc(s.r)}" data-in="r" data-e="${i}" data-s="${j}" ${s.ok?'style="background:var(--acc-soft);border-color:transparent"':''}>
     <button class="tk ${s.ok?'y':''}" data-a="tick" data-e="${i}" data-s="${j}" aria-label="Set ${j+1} done">${ic('check')}</button>`}).join('')}
   </div>
   <button class="addset" data-a="addSet" data-e="${i}">${ic('plus')}Add set</button></div>`;
}
function restBar(){return `<div class="restbar"><div class="sp"><div class="lbl" style="color:var(--mute)">Rest</div><div class="clock" id="rst">${mmss((V.rest.end-Date.now())/1000)}</div></div>

   <div class="card"><div class="row" style="margin-bottom:12px"><h3 class="sp">This week</h3><span class="mute" style="font-size:14px"><b style="color:var(--text)">${thisWeek}</b> / ${S.days} sessions</span></div>
    <div class="week">${wk.map(k=>{const d=fromKey(k);return `<div>${'MTWTFSS'[(d.getDay()+6)%7]}<i class="${days.has(k)?'y':''} ${k===t?'t':''}">${d.getDate()}</i></div>`}).join('')}</div></div>
   <div class="stats"><div class="stat"><b>${total}</b><small>Sessions</small></div><div class="stat"><b>${streak()}</b><small>Day streak</small></div><div class="stat"><b>${sets}</b><small>Sets logged</small></div></div>
   ${list.length?`<div class="steps">${list.map(s=>{const d=fromKey(s.d),st=Object.values(s.st||{}).filter(Boolean).length;
     return `<button class="sess" data-a="openDay" data-v="${s.id}"><span class="d"><small>${DOW[d.getDay()]}</small><b>${d.getDate()}</b><small>${MON[d.getMonth()]}</small></span>
      <span class="sp"><b>${DAYS[s.k].n}</b><div class="mute" style="font-size:13px">${plural(setsOf(s),'set')} · ${Math.round(volOf(s)).toLocaleString()} ${S.unit} · ${Math.max(1,Math.round((s.t1-s.t0)/60000))} min</div>
      <span class="trio"><span class="${st?'y':''}">Stretch</span><span class="${s.ca.done||s.ca.sec>60?'y':''}">Cardio</span><span class="${setsOf(s)?'y':''}">Lift</span></span></span>${ic('chev','dim')}</button>`}).join('')}</div>`
   :`<div class="card" style="text-align:center;padding:28px 16px"><h3>Nothing logged yet</h3><p class="mute" style="font-size:14px;margin-top:6px">Finish your first day and it shows up here.</p></div>`}
  </div>`;
}
function dayView(){
  const s=S.log.find(x=>x.id===V.logId);if(!s){V.view='tab';return logTab()}
  const d=fromKey(s.d),mus=[...new Set((s.ex||[]).flatMap(e=>EX[e.id].m))];
  return `<div class="v" style="padding-bottom:40px">
   <div class="row"><button class="x" data-a="closeDay">${ic('back')}</button><div class="sp"><div class="lbl">${DOW[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}</div><h2 style="font-size:24px;font-weight:800">${DAYS[s.k].n} day</h2></div></div>
   <div class="stage" style="height:240px"><div class="pair" style="position:absolute;inset:0;padding:16px 0 22px">${fig('front',litOf(mus))}${fig('back',litOf(mus))}</div><div class="floor"></div></div>
   <div class="stats"><div class="stat"><b>${Math.max(1,Math.round((s.t1-s.t0)/60000))}<small> min</small></b><small>Time</small></div><div class="stat"><b>${setsOf(s)}</b><small>Sets</small></div><div class="stat"><b>${Math.round(volOf(s)).toLocaleString()}</b><small>${S.unit} moved</small></div></div>
   <div class="card"><div class="row"><span class="ic on">${ic('stretch')}</span><div class="sp"><h3>Stretch</h3><div class="mute" style="font-size:13px">${Object.entries(s.st||{}).filter(([,v])=>v).map(([k])=>STR[k].n).join(', ')||'Skipped'}</div></div></div></div>
   <div class="card"><div class="row"><span class="ic on">${ic('cardio')}</span><div class="sp"><h3>${esc(s.ca.type)}</h3><div class="mute" style="font-size:13px">${s.ca.sec>0?mmss(s.ca.sec):'Skipped'}${s.ca.dist?` · ${esc(s.ca.dist)} ${S.unit==='lb'?'mi':'km'}`:''}</div></div></div></div>
   ${(s.ex||[]).map(e=>{const R=parseR(EX[e.id].r);return `<div class="card"><h3>${EX[e.id].n}</h3><table class="tbl" style="margin-top:8px">${e.sets.map((x,j)=>`<tr><td>Set ${j+1}</td><td>${R.hold?`${esc(x.r)}s`:`${x.w?esc(x.w)+' '+S.unit+' × ':''}${esc(x.r)} reps`}${x.ok?'':' <span class="dim">(not ticked)</span>'}</td></tr>`).join('')}</table></div>`}).join('')}
   <button class="btn ghost" data-a="delAsk" data-v="${s.id}" style="color:var(--warn)">Delete this session</button>
   ${V.delAsk===s.id?`<div class="card"><p style="font-size:14px">Delete this session for good? It can’t be undone.</p><div class="row" style="margin-top:12px"><button class="btn ghost" data-a="delNo">Keep it</button><button class="btn" style="background:var(--warn);color:#fff" data-a="del" data-v="${s.id}">Delete</button></div></div>`:''}
  </div>`;
}

/* ── you ── */
function youTab(){
  const sd=split().d;
  return `<div class="v">
   <div><div class="lbl">Settings</div><h1 style="margin-top:4px">${S.name?esc(S.name):'You'}</h1></div>
   <div class="card" style="display:flex;flex-direction:column;gap:12px">
    <div class="field"><span class="lbl">Name</span><input value="${esc(S.name)}" maxlength="24" data-in="name" placeholder="Your name"></div>
    <span class="lbl">Body to show</span>
    <div class="seg"><button class="${S.sex==='male'?'on':''}" data-a="set" data-k="sex" data-v="male">Man</button><button class="${S.sex==='female'?'on':''}" data-a="set" data-k="sex" data-v="female">Woman</button></div></div>
   <div class="card" style="display:flex;flex-direction:column;gap:12px">
    <div class="row"><h3 class="sp">Your plan</h3><span class="tag">${split().n}</span></div>
    <div class="seg">${[3,4,5,6].map(n=>`<button class="${S.days===n?'on':''}" data-a="set" data-k="days" data-v="${n}">${n}/wk</button>`).join('')}</div>
    <div class="mlist">${sd.map((k,i)=>`<div class="it"><span class="ic ${i===S.idx%sd.length?'on':''}" style="font-family:var(--disp);font-weight:800">${i+1}</span><span class="sp"><b>${DAYS[k].n}</b><div class="mute" style="font-size:13px">${exList(k).map(id=>EX[id].n).join(' · ')}</div></span>${i===S.idx%sd.length?'<span class="tag">Up next</span>':''}</div>`).join('')}</div>
    <span class="lbl">Where</span>
    <div class="seg"><button class="${S.place==='gym'?'on':''}" data-a="set" data-k="place" data-v="gym">Gym</button><button class="${S.place==='home'?'on':''}" data-a="set" data-k="place" data-v="home">Home</button></div>
    <span class="lbl">Cardio length</span>
    <div class="seg">${[5,10,15,20,30].map(m=>`<button class="${S.cardio===m?'on':''}" data-a="set" data-k="cardio" data-v="${m}">${m}m</button>`).join('')}</div>
    <span class="lbl">Weights in</span>
    <div class="seg"><button class="${S.unit==='kg'?'on':''}" data-a="set" data-k="unit" data-v="kg">kg</button><button class="${S.unit==='lb'?'on':''}" data-a="set" data-k="unit" data-v="lb">lb</button></div></div>
   <div class="card" style="display:flex;flex-direction:column;gap:10px">
    <h3>Backup</h3><p class="mute" style="font-size:13px">Everything stays on this phone. Copy a backup now and then, and paste it here to restore.</p>
    <div class="row"><button class="btn ghost" data-a="copy" style="height:46px">Copy backup</button><button class="btn ghost" data-a="restoreOpen" style="height:46px">Restore</button></div>
    ${V.restore?`<div class="field"><input id="rs" placeholder="Paste backup text"></div><button class="btn" data-a="restore" style="height:46px">Restore from text</button>`:''}
    <button class="addset" data-a="resetAsk" style="color:var(--warn);justify-content:center">Erase everything</button>
    ${V.resetAsk?`<p style="font-size:14px">Erase all sessions and settings on this phone? It can’t be undone.</p><div class="row"><button class="btn ghost" data-a="resetNo" style="height:46px">Cancel</button><button class="btn" style="height:46px;background:var(--warn);color:#fff" data-a="reset">Erase</button></div>`:''}
   </div>
   <p class="dim" style="font-size:12px;text-align:center">Anatomy figures adapted from muscle_mapper by Surya Mouly (MIT).</p>
  </div>`;
}

/* ── sheets ── */
function sheet(){
  const sh=V.sheet;let inner='';
  if(sh.t==='ex'){const X=EX[sh.id],last=lastFor(sh.id);
    inner=`<div class="row"><div class="sp"><div class="lbl">Exercise</div><h2 style="font-size:22px;margin-top:4px">${X.n}</h2></div><button class="x" data-a="close">${ic('x')}</button></div>
     <div class="stage" style="height:280px"><div class="pair" style="position:absolute;inset:0;padding:16px 0 22px">${fig('front',{[X.m[0]]:2,...Object.fromEntries(X.m.slice(1).map(g=>[g,1]))})}${fig('back',{[X.m[0]]:2,...Object.fromEntries(X.m.slice(1).map(g=>[g,1]))})}</div><div class="floor"></div></div>
     <div class="musc">${X.m.map((g,i)=>`<span style="${i?'opacity:.7':''}">${GN[g]}${i?'':' · main'}</span>`).join('')}</div>
     <div class="stats"><div class="stat"><b>${X.s}</b><small>Sets</small></div><div class="stat"><b>${X.r}</b><small>${parseR(X.r).hold?'Hold':'Reps'}</small></div><div class="stat"><b>${X.rest>=60?(X.rest/60)+'m':X.rest+'s'}</b><small>Rest</small></div></div>
     <div><h3 style="margin-bottom:10px">How to</h3><ol class="howto">${X.how.map(t=>`<li>${esc(t)}</li>`).join('')}</ol></div>
     ${last?`<div class="card" style="background:var(--card2)"><div class="lbl">Last time</div><div style="margin-top:6px">${doneSets(last).map(s=>s.w?`${s.w} ${S.unit} × ${s.r}`:s.r).join(' · ')}</div></div>`:''}`;
  }else if(sh.t==='finish'){
    const c=S.cur,left=c.ex.reduce((a,e)=>a+e.sets.filter(s=>!s.ok).length,0);
    inner=`<div class="grab"></div><h2>Finish the session?</h2><p class="mute" style="font-size:14px">${left?`${plural(left,'set')} not ticked. Only ticked sets count as done.`:'Everything is ticked. Nice work.'}</p>
     <button class="btn" data-a="finish">Finish and save</button><button class="btn ghost" data-a="close">Keep going</button>
     <button class="addset" data-a="discard" style="justify-content:center;color:var(--warn)">Discard this session</button>`;
  }
  return `<div class="scrim" data-a="close"><div class="sheet" data-stop>${inner}</div></div>`;
}

/* ══════════════ TIMERS ══════════════ */
let tickH=0;
function tick(){
  clearInterval(tickH);
  if(V.view!=='run')return;
  tickH=setInterval(()=>{
    const c=S.cur;if(!c)return;const now=Date.now();
    const t=document.getElementById('tot');if(t)t.textContent=mmss((now-c.t0)/1000);
    if(V.str){const left=(V.str.end-now)/1000;
      if(left<=0){c.st[V.str.id]=true;const ids=Object.keys(c.st),nx=ids.find(id=>!c.st[id]);V.str=null;buzz(200);save();
        if(nx){startStr(nx)}render();return}
      const e=document.getElementById('stt');if(e)e.textContent=Math.ceil(left);
      const r=document.getElementById('str');if(r)r.setAttribute('stroke-dashoffset',(150.8*(1-left/V.str.tot)).toFixed(1));}
    if(c.ca.run){const sec=caSec(c.ca),e=document.getElementById('cat');if(e)e.textContent=mmss(sec);
      const r=document.getElementById('car'),C=2*Math.PI*104;if(r)r.setAttribute('stroke-dashoffset',(C*(1-Math.min(1,sec/(c.ca.goal*60)))).toFixed(1));
      if(sec>=c.ca.goal*60&&!c.ca.hit){c.ca.hit=1;buzz([200,100,200]);toast('Cardio target hit')}}
    if(V.rest){const left=(V.rest.end-now)/1000;
      if(left<=0){V.rest=null;buzz([150,80,150]);render();return}
      const e=document.getElementById('rst');if(e)e.textContent=mmss(left);}
  },250);
}
function startStr(id){const s=STR[id],tot=s.sec*(s.sides||1);V.str={id,end:Date.now()+tot*1000,tot}}
let wake=null;async function keepAwake(){try{if('wakeLock' in navigator&&!wake)wake=await navigator.wakeLock.request('screen');wake&&wake.addEventListener('release',()=>wake=null)}catch(e){}}

/* ══════════════ ACTIONS ══════════════ */
const A={
 tab:v=>{V.tab=v;V.view='tab';V.restore=false;V.resetAsk=false;scrollTo(0,0)},
 obn:()=>{V.ob++},obb:()=>{V.ob=Math.max(0,V.ob-1)},
 obgo:()=>{S.onb=true;V.view='tab';V.tab='today';save()},
 set:(v,el)=>{const k=el.dataset.k;S[k]=['days','cardio'].includes(k)?+v:v;if(k==='days'||k==='place')S.idx=S.idx%split().d.length;save()},
 start:v=>{S.cur=newSession();S.cur.step=+v||0;V.view='run';save();keepAwake();scrollTo(0,0)},
 resume:()=>{V.view='run';keepAwake();scrollTo(0,0)},
 goStep:v=>{if(!S.cur){A.start(v);return}S.cur.step=+v;V.view='run';save();scrollTo(0,0)},
 leave:()=>{V.view='tab';V.tab='today';V.str=null},
 stPlay:v=>{if(V.str&&V.str.id===v){V.str=null}else startStr(v)},
 stTog:v=>{S.cur.st[v]=!S.cur.st[v];save()},
 caType:v=>{S.cur.ca.type=v;S.cardioType=v;save()},
 caGoal:v=>{S.cur.ca.goal=+v;S.cur.ca.hit=0;save()},
 caRun:()=>{const ca=S.cur.ca;if(ca.run){ca.sec=caSec(ca);ca.run=0}else ca.run=Date.now();save()},
 caDone:()=>{const ca=S.cur.ca;if(ca.run){ca.sec=caSec(ca);ca.run=0}ca.done=true;S.cur.step=2;save();scrollTo(0,0)},
 tick:(v,el)=>{const e=S.cur.ex[+el.dataset.e],s=e.sets[+el.dataset.s],X=EX[e.id],R=parseR(X.r),last=lastFor(e.id),ls=last&&doneSets(last)[+el.dataset.s];
   if(!s.ok){if(!s.r)s.r=String(ls?ls.r:R.hi);if(!s.w&&ls&&ls.w)s.w=String(ls.w);s.ok=true;V.rest={end:Date.now()+X.rest*1000};buzz(30)}else{s.ok=false}save()},
 addSet:(v,el)=>{const e=S.cur.ex[+el.dataset.e],p=e.sets[e.sets.length-1];e.sets.push({w:p?p.w:'',r:'',ok:false});save()},
 restAdd:v=>{if(V.rest)V.rest.end+=(+v)*1000},restSkip:()=>{V.rest=null},
 exInfo:v=>{V.sheet={t:'ex',id:v}},close:()=>{V.sheet=null},
 finishAsk:()=>{V.sheet={t:'finish'}},finish:()=>{V.sheet=null;finish()},
 discard:()=>{S.cur=null;V.sheet=null;V.rest=null;V.str=null;V.view='tab';V.tab='today';save()},
 home:()=>{V.view='tab';V.tab='today';scrollTo(0,0)},
 rotate:()=>{V.side=V.side==='front'?'back':'front';if(V.sel&&!(V.side==='front'?FRONTG:BACKG).includes(V.sel))V.sel=null},
 pick:v=>{V.sel=v||null},
 openDay:v=>{V.logId=v;V.view='day';V.delAsk=null;scrollTo(0,0)},closeDay:()=>{V.view='tab';V.tab='log'},
 delAsk:v=>{V.delAsk=v},delNo:()=>{V.delAsk=null},del:v=>{S.log=S.log.filter(s=>s.id!==v);save();V.view='tab';V.tab='log'},
 copy:()=>{const t=JSON.stringify(S);(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Backup copied'),()=>{V.restore=true;render();const i=document.getElementById('rs');if(i){i.value=t;i.select()}toast('Select and copy the text')})},
 restoreOpen:()=>{V.restore=!V.restore},
 restore:()=>{try{const o=JSON.parse(document.getElementById('rs').value);if(o.v!==2)throw 0;S=Object.assign(fresh(),o);save();V.restore=false;toast('Restored')}catch(e){toast('That text is not a backup')}},
 resetAsk:()=>{V.resetAsk=true},resetNo:()=>{V.resetAsk=false},
 reset:()=>{S=fresh();save();V={...V,view:'ob',ob:0,tab:'today',resetAsk:false}},
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');
  /* tap on the body figure */
  if(!el||el.classList.contains('stage')){const g=e.target.closest('.fig.tap g[data-m]');if(g&&ID2G[g.dataset.m]){V.sel=ID2G[g.dataset.m];render();return}}
  if(!el)return;
  if(el.classList.contains('scrim')&&e.target.closest('[data-stop]'))return;
  const f=A[el.dataset.a];if(!f)return;f(el.dataset.v,el);if(!toast.h||el.dataset.a!=='copy')render();
});
document.addEventListener('input',e=>{
  const el=e.target,k=el.dataset.in;if(!k)return;
  if(k==='name')S.name=el.value.trim();
  else if(k==='dist')S.cur.ca.dist=el.value;
  else if(k==='w'||k==='r'){S.cur.ex[+el.dataset.e].sets[+el.dataset.s][k]=el.value.replace(/[^\d.]/g,'')}
  save();
});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&V.view==='run'){keepAwake();render()}});
render();
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
