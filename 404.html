<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Closed</title>
<style>
:root{color-scheme:dark}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0B0B0C;color:#EDEDF0;font:16px/1.5 -apple-system,system-ui,sans-serif;padding:24px max(24px,env(safe-area-inset-left)) 24px max(24px,env(safe-area-inset-right));box-sizing:border-box}
main{max-width:360px;text-align:center;display:flex;flex-direction:column;gap:14px}
h1{font-size:26px;margin:0}
p{margin:0;color:#9A9AA3}
button{margin-top:18px;background:none;border:1px solid #2A2A30;color:#9A9AA3;border-radius:12px;padding:12px;font:inherit;font-size:14px}
textarea{width:100%;height:120px;background:#151518;color:#EDEDF0;border:1px solid #2A2A30;border-radius:10px;font-size:12px}
</style>
</head><body>
<main>
  <h1>This app has closed.</h1>
  <p>This link no longer works.</p>
  <button id="b" hidden>Copy my saved data</button>
  <textarea id="t" hidden readonly></textarea>
</main>
<script>
/* switch off the old offline copy so the old app cannot open again */
if('serviceWorker' in navigator)navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{});
if(window.caches)caches.keys().then(ks=>ks.forEach(k=>{if(/^(getfit|gatelift)/.test(k))caches.delete(k)})).catch(()=>{});
/* the owner of this phone can still take their own data with them */
let d=null;try{d=localStorage.getItem('gatelift.v2')}catch(e){}
const b=document.getElementById('b'),t=document.getElementById('t');
if(d){b.hidden=false;b.onclick=()=>{(navigator.clipboard?navigator.clipboard.writeText(d):Promise.reject()).then(()=>{b.textContent='Copied'},()=>{t.hidden=false;t.value=d;t.select();b.textContent='Select the text and copy it'})}}
</script>
</body></html>
